<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edesvino - Sales & Earnings</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
}

.header {
  background: #111827;
  color: white;
  padding: 25px;
  border-radius: 12px;
  text-align: center;
}

.card {
  background: white;
  margin-top: 15px;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.stat {
  padding: 15px 0;
  border-bottom: 1px solid #ddd;
}

.stat:last-child {
  border-bottom: none;
}

.stat h2 {
  margin-bottom: 5px;
}

.amount {
  font-size: 25px;
  font-weight: bold;
}

.order {
  border-bottom: 1px solid #ddd;
  padding: 15px 0;
}

.order:last-child {
  border-bottom: none;
}

.message {
  text-align: center;
  padding: 20px;
}

.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #111827;
  font-weight: bold;
  text-decoration: none;
}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>Edesvino</h1>

    <p>Sales & Earnings</p>

  </div>


  <div id="loading"
       class="message">

    Loading sales...

  </div>


  <div id="salesContent"
       style="display:none;">

    <div class="card">

      <div class="stat">

        <h2>Total Sales</h2>

        <div
          class="amount"
          id="totalSales">

          ₦0

        </div>

      </div>


      <div class="stat">

        <h2>Total Orders</h2>

        <div
          class="amount"
          id="totalOrders">

          0

        </div>

      </div>


      <div class="stat">

        <h2>Seller Earnings</h2>

        <div
          class="amount"
          id="sellerEarnings">

          ₦0

        </div>

      </div>

      <p>
        Current earnings based on completed
        customer orders.
      </p>

    </div>


    <div class="card">

      <h2>Recent Orders</h2>

      <div id="recentOrders"></div>

    </div>

  </div>


  <a
    class="back"
    href="dashboard.html">

    ← Back to Seller Dashboard

  </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function loadSales() {

  const loading =
  document.getElementById("loading");

  const content =
  document.getElementById("salesContent");


  const {
    data: userData,
    error: userError
  } =
  await supabaseClient.auth.getUser();


  if (userError || !userData.user) {

    window.location.replace("login.html");

    return;

  }


  const user =
  userData.user;


  const {
    data: orders,
    error
  } =
  await supabaseClient
    .from("orders")
    .select("*")
    .eq("seller_id", user.id)
    .order(
      "created_at",
      { ascending: false }
    );


  if (error) {

    loading.textContent =
    "Unable to load sales: " +
    error.message;

    return;

  }


  let totalSales = 0;


  if (orders) {

    orders.forEach(function(order) {

      totalSales +=
      Number(order.price) || 0;

    });

  }


  document.getElementById(
    "totalSales"
  ).textContent =
  "₦" +
  totalSales.toLocaleString();


  document.getElementById(
    "totalOrders"
  ).textContent =
  orders ? orders.length : 0;


  document.getElementById(
    "sellerEarnings"
  ).textContent =
  "₦" +
  totalSales.toLocaleString();


  const recentOrders =
  document.getElementById(
    "recentOrders"
  );


  if (!orders || orders.length === 0) {

    recentOrders.innerHTML =
    "<p>No orders yet.</p>";

  } else {

    orders.forEach(function(order) {

      const item =
      document.createElement("div");

      item.className =
      "order";


      item.innerHTML = `

        <strong>
          ${order.product_name}
        </strong>

        <p>
          Amount:
          ₦${Number(
            order.price
          ).toLocaleString()}
        </p>

        <p>
          Customer:
          ${order.customer_name}
        </p>

        <p>
          Date:
          ${new Date(
            order.created_at
          ).toLocaleString()}
        </p>

      `;


      recentOrders.appendChild(item);

    });

  }


  loading.style.display =
  "none";

  content.style.display =
  "block";

}


loadSales();

</script>

</body>
</html>
