<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales & Earnings - Edesvino</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .amount {
      font-size: 28px;
      font-weight: bold;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      padding: 12px 18px;
      background: #222;
      color: white;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💰 Sales & Earnings</h1>

  <div class="card">
    <h2>Total Sales</h2>
    <div class="amount" id="totalSales">₦0</div>
  </div>

  <div class="card">
    <h2>Total Orders</h2>
    <div class="amount" id="totalOrders">0</div>
  </div>

  <div class="card">
    <h2>Seller Earnings</h2>
    <div class="amount" id="sellerEarnings">₦0</div>
  </div>

  <a class="back" href="dashboard.html">
    ← Back to Seller Dashboard
  </a>

</div>

<script>

  const savedOrder = localStorage.getItem("edesvinoOrder");

  if (savedOrder) {

    const order = JSON.parse(savedOrder);

    const price = Number(order.price) || 0;

    document.getElementById("totalSales").textContent =
      "₦" + price.toLocaleString();

    document.getElementById("totalOrders").textContent = "1";

    document.getElementById("sellerEarnings").textContent =
      "₦" + price.toLocaleString();

  }

</script>

</body>
</html>
