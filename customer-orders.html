<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edesvino - My Orders</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: 30px auto;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  margin-bottom: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

.order {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 18px;
  margin-bottom: 15px;
}

.order h2 {
  margin-top: 0;
}

.order p {
  margin: 8px 0;
}

.status {
  font-weight: bold;
}

.loading,
.empty,
.error {
  text-align: center;
  padding: 20px;
}

.error {
  color: #b91c1c;
}

.links {
  text-align: center;
  margin-top: 20px;
}

.links a {
  display: inline-block;
  margin: 5px;
  padding: 10px 15px;
  background: #111827;
  color: white;
  border-radius: 8px;
  text-decoration: none;
}

</style>

</head>

<body>

<div class="container">

  <div class="card">

    <h1>Edesvino</h1>

    <p class="subtitle">
      My Orders
    </p>

    <div id="ordersContainer">

      <div class="loading">
        Loading your orders...
      </div>

    </div>

    <div class="links">

      <a href="customer-dashboard.html">
        Customer Dashboard
      </a>

      <a href="track-order.html">
        Track Order
      </a>

      <a href="index.html">
        Continue Shopping
      </a>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);


async function loadOrders() {

  const container =
    document.getElementById(
      "ordersContainer"
    );


  try {

    /*
      Give Supabase a moment to restore
      the existing customer session.
    */

    await new Promise(
      function(resolve) {
        setTimeout(
          resolve,
          500
        );
      }
    );


    /*
      Get the current session first.
    */

    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (
      sessionError
    ) {

      throw sessionError;

    }


    let session =
      sessionData.session;


    /*
      If no session is immediately available,
      give Supabase another moment to restore it.
    */

    if (!session) {

      await new Promise(
        function(resolve) {
          setTimeout(
            resolve,
            1000
          );
        }
      );


      const retry =
        await supabaseClient.auth.getSession();


      session =
        retry.data.session;

    }


    /*
      Still no session means the customer
      is genuinely logged out.
    */

    if (!session) {

      window.location.replace(
        "customer-login.html"
      );

      return;

    }


    /*
      Get the authenticated user.
    */

    const {
      data: userData,
      error: userError
    } =
    await supabaseClient.auth.getUser();


    if (
      userError ||
      !userData.user
    ) {

      window.location.replace(
        "customer-login.html"
      );

      return;

    }


    const user =
      userData.user;


    /*
      First find orders using customer_id.
    */

    let {
      data: orders,
      error
    } =
    await supabaseClient
      .from("orders")
      .select("*")
      .eq(
        "customer_id",
        user.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    /*
      If older orders don't have customer_id,
      use the customer's name as a fallback.
    */

    if (
      !error &&
      (!orders ||
       orders.length === 0)
    ) {

      const customerName =
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        "Endurance Edirin Jackson";


      const fallbackResult =
        await supabaseClient
          .from("orders")
          .select("*")
          .eq(
            "customer_name",
            customerName
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (
        !fallbackResult.error &&
        fallbackResult.data
      ) {

        orders =
          fallbackResult.data;

      }

    }


    if (error) {

      throw error;

    }


    /*
      No orders.
    */

    if (
      !orders ||
      orders.length === 0
    ) {

      container.innerHTML = `
        <div class="empty">
          You don't have any orders yet.
        </div>
      `;

      return;

    }


    /*
      Display orders.
    */

    container.innerHTML = "";


    orders.forEach(
      function(order) {

        const orderDate =
          order.created_at
          ? new Date(
              order.created_at
            ).toLocaleString(
              "en-NG"
            )
          : "Not available";


        const orderBox =
          document.createElement(
            "div"
          );


        orderBox.className =
          "order";


        orderBox.innerHTML = `

          <h2>
            Order #${escapeHtml(
              order.id
            )}
          </h2>

          <p>
            <strong>Product:</strong>
            ${escapeHtml(
              order.product_name ||
              "Product"
            )}
          </p>

          <p>
            <strong>Amount:</strong>
            ₦${Number(
              order.price || 0
            ).toLocaleString(
              "en-NG"
            )}
          </p>

          <p>
            <strong>Customer:</strong>
            ${escapeHtml(
              order.customer_name ||
              ""
            )}
          </p>

          <p>
            <strong>Order Date:</strong>
            ${escapeHtml(
              orderDate
            )}
          </p>

          <p>
            <strong>Order Status:</strong>
            <span class="status">
              ${escapeHtml(
                order.status ||
                "Pending"
              )}
            </span>
          </p>

        `;


        container.appendChild(
          orderBox
        );

      }
    );


  } catch (error) {

    console.error(
      "Customer orders error:",
      error
    );


    container.innerHTML = `
      <div class="error">
        Unable to load your orders.
        <br><br>
        ${escapeHtml(
          error.message
        )}
      </div>
    `;

  }

}


/*
  HTML safety.
*/

function escapeHtml(value) {

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


loadOrders();

</script>

</body>
</html>
