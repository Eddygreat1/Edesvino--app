<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orders - Edesvino</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
}

.header {
  background: #111827;
  color: white;
  padding: 25px;
  text-align: center;
  border-radius: 12px;
}

.order-card {
  background: white;
  padding: 20px;
  margin-top: 15px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.order-card h2 {
  margin-top: 0;
}

.info {
  margin: 10px 0;
  line-height: 1.6;
}

.amount {
  font-size: 22px;
  font-weight: bold;
}

.empty {
  background: white;
  padding: 25px;
  margin-top: 15px;
  border-radius: 12px;
  text-align: center;
}

.error {
  background: #fef2f2;
  color: #991b1b;
  padding: 15px;
  margin-top: 15px;
  border-radius: 8px;
}

.back {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  background: #111827;
  color: white;
  text-align: center;
  text-decoration: none;
  border-radius: 8px;
  box-sizing: border-box;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Edesvino</h1>
    <p>Customer Orders</p>
  </div>

  <div id="ordersContainer">
    <div class="empty">
      Loading orders...
    </div>
  </div>

  <a href="dashboard.html" class="back">
    ← Back to Seller Dashboard
  </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadOrders() {

  const container =
    document.getElementById("ordersContainer");


  const { data, error } =
    await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    console.error(error);

    container.innerHTML =
      '<div class="error">' +
      'Unable to load orders: ' +
      error.message +
      '</div>';

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      '<div class="empty">' +
      '<h2>No orders yet</h2>' +
      '<p>Customer orders will appear here.</p>' +
      '</div>';

    return;
  }


  container.innerHTML = "";


  data.forEach(function(order) {

    const card =
      document.createElement("div");

    card.className = "order-card";


    const date =
      order.created_at
        ? new Date(order.created_at)
            .toLocaleString()
        : "Date unavailable";


    card.innerHTML = `

      <h2>${escapeHtml(
        order.product_name
      )}</h2>

      <div class="amount">
        ₦${Number(
          order.price
        ).toLocaleString()}
      </div>

      <div class="info">

        <strong>Customer:</strong>
        ${escapeHtml(
          order.customer_name
        )}

        <br>

        <strong>Phone:</strong>
        ${escapeHtml(
          order.customer_phone
        )}

        <br>

        <strong>Delivery Address:</strong>
        ${escapeHtml(
          order.delivery_address
        )}

        <br>

        <strong>Order Date:</strong>
        ${escapeHtml(date)}

      </div>

    `;


    container.appendChild(card);

  });

}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


loadOrders();

</script>

</body>
</html>
