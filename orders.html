<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edesvino - Customer Orders</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
}

.header {
  background: #111827;
  color: white;
  padding: 25px;
  border-radius: 12px;
  text-align: center;
}

.card {
  background: white;
  margin-top: 15px;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.order {
  border-bottom: 1px solid #ddd;
  padding: 15px 0;
}

.order:last-child {
  border-bottom: none;
}

.amount {
  font-size: 20px;
  font-weight: bold;
}

.message {
  text-align: center;
  padding: 20px;
}

.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #111827;
  font-weight: bold;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Edesvino</h1>
    <p>Customer Orders</p>
  </div>

  <div class="card">

    <div id="message" class="message">
      Loading your orders...
    </div>

    <div id="orders"></div>

  </div>

  <a class="back" href="dashboard.html">
    ← Back to Seller Dashboard
  </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function loadOrders() {

  const message =
  document.getElementById("message");

  const ordersDiv =
  document.getElementById("orders");


  const {
    data: userData,
    error: userError
  } =
  await supabaseClient.auth.getUser();


  if (userError || !userData.user) {

    window.location.replace("login.html");

    return;
  }


  const user =
  userData.user;


  const {
    data: orders,
    error
  } =
  await supabaseClient
    .from("orders")
    .select("*")
    .eq("seller_id", user.id)
    .order(
      "created_at",
      { ascending: false }
    );


  if (error) {

    message.textContent =
    "Unable to load orders: " +
    error.message;

    return;
  }


  message.style.display = "none";


  if (!orders || orders.length === 0) {

    message.style.display = "block";

    message.textContent =
    "You have no orders yet.";

    return;
  }


  orders.forEach(function(order) {

    const item =
    document.createElement("div");

    item.className = "order";


    item.innerHTML = `

      <h2>
        ${order.product_name}
      </h2>

      <div class="amount">
        ₦${Number(
          order.price
        ).toLocaleString()}
      </div>

      <p>
        <strong>Customer:</strong>
        ${order.customer_name}
      </p>

      <p>
        <strong>Phone:</strong>
        ${order.customer_phone}
      </p>

      <p>
        <strong>Delivery Address:</strong>
        ${order.delivery_address}
      </p>

      <p>
        <strong>Order Date:</strong>
        ${new Date(
          order.created_at
        ).toLocaleString()}
      </p>

    `;


    ordersDiv.appendChild(item);

  });

}


loadOrders();

</script>

</body>
</html>
