<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edesvino - Orders</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
    }

    h1 {
      text-align: center;
    }

    .order {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .empty {
      background: white;
      padding: 25px;
      text-align: center;
      border-radius: 10px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Customer Orders</h1>

    <div id="orders"></div>

    <a class="back" href="dashboard.html">
      ← Back to Seller Dashboard
    </a>

  </div>

  <script>

    const ordersContainer = document.getElementById("orders");

    const savedOrder = localStorage.getItem("edesvinoOrder");

    if (!savedOrder) {

      ordersContainer.innerHTML = `
        <div class="empty">
          <h2>No orders yet</h2>
          <p>Customer orders will appear here.</p>
        </div>
      `;

    } else {

      const order = JSON.parse(savedOrder);

      ordersContainer.innerHTML = `

        <div class="order">

          <h2>${order.product}</h2>

          <p>
            <strong>Price:</strong>
            ₦${Number(order.price).toLocaleString()}
          </p>

          <p>
            <strong>Customer:</strong>
            ${order.name}
          </p>

          <p>
            <strong>Phone:</strong>
            ${order.phone}
          </p>

          <p>
            <strong>Delivery Address:</strong>
            ${order.address}
          </p>

          <p>
            <strong>Order Date:</strong>
            ${order.date}
          </p>

        </div>

      `;

    }

  </script>

</body>
</html>
