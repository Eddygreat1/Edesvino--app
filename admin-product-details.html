<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Edesvino Platform Admin Product Details">
  <title>Platform Admin - Product Details</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    .status,
    .summary,
    .orders-box {
      background: white;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .error {
      background: #ffe5e5;
      color: #b00020;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .summary h2 {
      margin-top: 0;
    }

    .summary p {
      margin: 8px 0;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
    }

    .order {
      background: #fafafa;
      padding: 15px;
      border-radius: 8px;
      margin-top: 12px;
    }

    .order h3 {
      margin-top: 0;
    }

    .order p {
      margin: 7px 0;
    }

    .back {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    .empty {
      color: #666;
      padding: 10px 0;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Platform Admin</h1>

  <div class="subtitle">
    Product Details
  </div>

  <div id="status" class="status">
    Connecting to Supabase...
  </div>

  <div id="error" class="error" style="display:none;"></div>

  <div id="productSummary" class="summary" style="display:none;"></div>

  <div id="ordersBox" class="orders-box" style="display:none;"></div>

  <a class="back" href="admin-products.html">
    ← Back to Marketplace Products
  </a>

</div>

<script>

const SUPABASE_URL =
  "https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const statusBox =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");

const productSummary =
  document.getElementById("productSummary");

const ordersBox =
  document.getElementById("ordersBox");


function showError(message) {

  statusBox.style.display = "none";

  errorBox.textContent = message;

  errorBox.style.display = "block";

}


async function loadProductDetails() {

  try {

    statusBox.textContent =
      "Checking admin login...";


    const {
      data: { user },
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (userError) {

      throw new Error(
        "Unable to check login: " +
        userError.message
      );

    }


    if (!user) {

      throw new Error(
        "You are not logged in."
      );

    }


    statusBox.textContent =
      "Checking admin permission...";


    const {
      data: adminRecord,
      error: adminError
    } =
      await supabaseClient
        .from("platform_admins")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();


    if (adminError) {

      throw new Error(
        "Unable to check admin permission: " +
        adminError.message
      );

    }


    if (!adminRecord) {

      throw new Error(
        "You do not have platform admin permission."
      );

    }


    const params =
      new URLSearchParams(
        window.location.search
      );


    const productId =
      params.get("product");


    if (!productId) {

      throw new Error(
        "No product was selected."
      );

    }


    statusBox.textContent =
      "Loading product...";


    const {
      data: product,
      error: productError
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .eq("id", productId)
        .maybeSingle();


    if (productError) {

      throw new Error(
        "Unable to load product: " +
        productError.message
      );

    }


    if (!product) {

      throw new Error(
        "Product not found."
      );

    }


    statusBox.textContent =
      "Loading product orders...";


    const {
      data: orders,
      error: ordersError
    } =
      await supabaseClient
        .from("orders")
        .select("*")
        .order("id", {
          ascending: false
        });


    if (ordersError) {

      throw new Error(
        "Unable to load orders: " +
        ordersError.message
      );

    }


    const productName =
      product.name ||
      product.product_name ||
      "Unnamed Product";


    const description =
      product.description ||
      "No description";


    const price =
      Number(
        product.price || 0
      );


    const seller =
      product.seller_name ||
      product.store_name ||
      "Edesvino Seller";


    /*
      Orders are matched by product name.

      This is only used to display order
      information. The product itself is
      loaded by its unique Product ID.
    */

    const productOrders =
      (orders || []).filter(order => {

        return String(
          order.product_name || ""
        )
        .trim()
        .toLowerCase() ===
        String(productName)
        .trim()
        .toLowerCase();

      });


    const totalOrderValue =
      productOrders.reduce(
        (total, order) => {

          return total +
            Number(order.price || 0);

        },
        0
      );


    statusBox.style.display =
      "none";


    productSummary.innerHTML = `

      <h2>
        ${productName}
      </h2>

      <p class="price">
        ₦${price.toLocaleString("en-NG")}
      </p>

      <p>
        <strong>Description:</strong>
        ${description}
      </p>

      <p>
        <strong>Seller:</strong>
        ${seller}
      </p>

      <p>
        <strong>Product ID:</strong>
        ${product.id}
      </p>

      <p>
        <strong>Total Orders:</strong>
        ${productOrders.length}
      </p>

      <p>
        <strong>Total Order Value:</strong>
        ₦${totalOrderValue.toLocaleString("en-NG")}
      </p>

    `;


    productSummary.style.display =
      "block";


    if (!productOrders.length) {

      ordersBox.innerHTML = `

        <h2>Orders</h2>

        <div class="empty">
          No orders found for this product.
        </div>

      `;

      ordersBox.style.display =
        "block";

      return;

    }


    ordersBox.innerHTML = `

      <h2>Orders</h2>

      ${
        productOrders.map(order => {

          const customer =
            order.customer_name ||
            "N/A";


          const amount =
            Number(
              order.price || 0
            )
            .toLocaleString("en-NG");


          const status =
            order.status ||
            "Pending";


          const date =
            order.created_at
              ? new Date(
                  order.created_at
                ).toLocaleString()
              : "N/A";


          return `

            <div class="order">

              <h3>
                Order #${order.id}
              </h3>

              <p>
                <strong>Customer:</strong>
                ${customer}
              </p>

              <p>
                <strong>Amount:</strong>
                ₦${amount}
              </p>

              <p>
                <strong>Status:</strong>
                ${status}
              </p>

              <p>
                <strong>Order Date:</strong>
                ${date}
              </p>

            </div>

          `;

        }).join("")
      }

    `;


    ordersBox.style.display =
      "block";


  } catch (error) {

    console.error(error);

    showError(
      error.message
    );

  }

}


loadProductDetails();

</script>

</body>
</html>
