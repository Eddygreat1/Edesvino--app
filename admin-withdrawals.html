<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edesvino - Admin Withdrawals</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 800px;
  margin: auto;
}

.header {
  background: #111827;
  color: white;
  padding: 25px;
  border-radius: 12px;
  text-align: center;
}

.card {
  background: white;
  margin-top: 15px;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.withdrawal {
  border-bottom: 1px solid #ddd;
  padding: 15px 0;
}

.withdrawal:last-child {
  border-bottom: none;
}

.amount {
  font-size: 24px;
  font-weight: bold;
}

.status {
  font-weight: bold;
  padding: 6px 10px;
  border-radius: 6px;
  display: inline-block;
  margin-top: 5px;
}

.pending {
  background: #fef3c7;
  color: #92400e;
}

.paid {
  background: #d1fae5;
  color: #065f46;
}

.rejected {
  background: #fee2e2;
  color: #991b1b;
}

button {
  border: none;
  padding: 10px 15px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 10px;
  margin-right: 8px;
}

.pay-button {
  background: #047857;
  color: white;
}

.reject-button {
  background: #b91c1c;
  color: white;
}

button:hover {
  opacity: 0.9;
}

.message {
  text-align: center;
  padding: 20px;
}

.error {
  color: #b91c1c;
  font-weight: bold;
}

.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #111827;
  font-weight: bold;
  text-decoration: none;
}

.note {
  color: #555;
  font-size: 14px;
  line-height: 1.5;
}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>Edesvino</h1>

    <p>Admin Withdrawals</p>

  </div>


  <div class="card">

    <h2>Review Seller Withdrawals</h2>

    <p class="note">
      Review withdrawal requests and mark them as Paid or Rejected.
    </p>

    <div id="message"
         class="message">

      Loading withdrawal requests...

    </div>

    <div id="withdrawals"></div>

  </div>


  <a
    class="back"
    href="admin.html">

    ← Back to Admin Dashboard

  </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/*
  Format Naira
*/

function formatNaira(amount) {

  return "₦" +
    Number(amount || 0).toLocaleString(
      "en-NG"
    );

}


/*
  Mask bank account number.

  Only the last 4 digits are displayed.
*/

function maskAccountNumber(accountNumber) {

  const number =
    String(accountNumber || "");

  if (number.length <= 4) {

    return number;

  }

  const lastFour =
    number.slice(-4);

  return "******" + lastFour;

}


/*
  Load withdrawals
*/

async function loadWithdrawals() {

  const withdrawalsDiv =
    document.getElementById(
      "withdrawals"
    );

  const message =
    document.getElementById(
      "message"
    );


  /*
    Clear previous results.

    This prevents duplicate records
    after an admin updates a withdrawal.
  */

  withdrawalsDiv.innerHTML = "";

  message.className = "message";

  message.textContent =
    "Loading withdrawal requests...";


  try {

    /*
      Check logged-in user.
    */

    const {
      data: userData,
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (
      userError ||
      !userData.user
    ) {

      message.innerHTML =
        '<p class="error">' +
        'Please log in first.' +
        '</p>';

      return;

    }


    const user =
      userData.user;


    /*
      Load withdrawals.

      The database RLS policy ensures
      only the platform administrator
      can see all withdrawal records.
    */

    const {
      data: withdrawals,
      error
    } =
      await supabaseClient
        .from("withdrawals")
        .select(
          "id, seller_id, amount, status, bank_name, account_name, account_number, created_at"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      message.innerHTML =
        '<p class="error">' +
        'Unable to load withdrawals: ' +
        error.message +
        '</p>';

      return;

    }


    if (
      !withdrawals ||
      withdrawals.length === 0
    ) {

      message.textContent =
        "No withdrawal requests yet.";

      return;

    }


    message.style.display =
      "none";


    withdrawals.forEach(
      function(withdrawal) {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "withdrawal";


        let statusClass =
          "pending";


        if (
          withdrawal.status === "Paid"
        ) {

          statusClass =
            "paid";

        }


        if (
          withdrawal.status === "Rejected"
        ) {

          statusClass =
            "rejected";

        }


        const accountNumber =
          maskAccountNumber(
            withdrawal.account_number
          );


        item.innerHTML = `

          <div class="amount">
            ${formatNaira(
              withdrawal.amount
            )}
          </div>

          <p>
            <strong>Bank:</strong>
            ${withdrawal.bank_name || "Not provided"}
          </p>

          <p>
            <strong>Account Name:</strong>
            ${withdrawal.account_name || "Not provided"}
          </p>

          <p>
            <strong>Account Number:</strong>
            ${accountNumber}
          </p>

          <p>
            <strong>Seller ID:</strong>
            ${withdrawal.seller_id}
          </p>

          <p>
            <strong>Date:</strong>
            ${
              withdrawal.created_at
                ? new Date(
                    withdrawal.created_at
                  ).toLocaleString(
                    "en-NG"
                  )
                : "Unknown"
            }
          </p>

          <p>
            <strong>Status:</strong>
            <span class="status ${statusClass}">
              ${withdrawal.status}
            </span>
          </p>

        `;


        /*
          Only Pending withdrawals
          can be changed.
        */

        if (
          withdrawal.status === "Pending"
        ) {

          const payButton =
            document.createElement(
              "button"
            );


          payButton.className =
            "pay-button";


          payButton.textContent =
            "Mark as Paid";


          payButton.onclick =
            async function() {

              const confirmed =
                confirm(
                  "Mark this withdrawal as Paid?"
                );


              if (!confirmed) {

                return;

              }


              await updateWithdrawalStatus(
                withdrawal.id,
                "Paid"
              );

            };


          item.appendChild(
            payButton
          );


          const rejectButton =
            document.createElement(
              "button"
            );


          rejectButton.className =
            "reject-button";


          rejectButton.textContent =
            "Reject";


          rejectButton.onclick =
            async function() {

              const confirmed =
                confirm(
                  "Reject this withdrawal request?"
                );


              if (!confirmed) {

                return;

              }


              await updateWithdrawalStatus(
                withdrawal.id,
                "Rejected"
              );

            };


          item.appendChild(
            rejectButton
          );

        }


        withdrawalsDiv.appendChild(
          item
        );

      }
    );


  } catch (error) {

    console.error(
      "Admin withdrawals error:",
      error
    );


    message.innerHTML =
      '<p class="error">' +
      'Something went wrong: ' +
      error.message +
      '</p>';

  }

}


/*
  Update withdrawal status
*/

async function updateWithdrawalStatus(
  withdrawalId,
  newStatus
) {

  try {

    const {
      error
    } =
      await supabaseClient
        .from("withdrawals")
        .update({
          status: newStatus
        })
        .eq(
          "id",
          withdrawalId
        );


    if (error) {

      alert(
        "Unable to update withdrawal: " +
        error.message
      );

      return;

    }


    alert(
      "Withdrawal status updated to " +
      newStatus +
      "."
    );


    /*
      Reload the list.

      This also prevents duplicate
      withdrawal records from appearing.
    */

    await loadWithdrawals();


  } catch (error) {

    console.error(
      "Update withdrawal error:",
      error
    );


    alert(
      "Something went wrong: " +
      error.message
    );

  }

}


loadWithdrawals();

</script>

</body>
</html>
