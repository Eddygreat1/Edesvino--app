<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edesvino - Customer Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .links {
      text-align: center;
      margin-top: 20px;
    }

    .links a {
      color: #111827;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>Edesvino</h1>

      <p class="subtitle">
        Customer Login
      </p>

      <form id="loginForm">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <button
          type="submit"
          id="loginButton"
        >
          Login
        </button>

      </form>

      <div
        id="message"
        class="message">
      </div>

      <div class="links">

        <p>
          Don't have a customer account?
          <a href="customer- register.html">
            Register
          </a>
        </p>

        <p>
          <a href="index.html">
            ← Back to Marketplace
          </a>
        </p>

      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://lxszilqypuglxyfyukdg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();

          const email =
            document
              .getElementById("email")
              .value
              .trim();

          const password =
            document
              .getElementById("password")
              .value;

          const button =
            document
              .getElementById("loginButton");

          const message =
            document
              .getElementById("message");

          button.disabled = true;
          button.textContent = "Logging in...";
          message.textContent = "";

          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword({
              email: email,
              password: password
            });

          if (error) {

            console.error(error);

            message.textContent =
              error.message;

            button.disabled = false;
            button.textContent = "Login";

            return;
          }

          message.textContent =
            "Login successful!";

          setTimeout(function() {

            window.location.href =
              "Customer - dashboard.html";

          }, 1000);

        }
      );
  </script>

</body>
</html>
