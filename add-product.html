<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Product - Edesvino Marketplace</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .image-help {
      color: #666;
      font-size: 13px;
      margin-top: 5px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: #111;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      text-align: center;
      display: none;
    }

    .success {
      background: #e7f7e7;
      color: #176b17;
    }

    .error {
      background: #ffe8e8;
      color: #a00000;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #111;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>Edesvino Marketplace</h1>
</header>

<div class="container">

  <div class="card">

    <h2>Add Product</h2>

    <form id="productForm">

      <label for="name">Product Name</label>

      <input
        type="text"
        id="name"
        placeholder="Example: Power bank"
        required
      >

      <label for="price">Price (₦)</label>

      <input
        type="number"
        id="price"
        placeholder="Example: 20000"
        min="0"
        required
      >

      <label for="description">Product Description</label>

      <textarea
        id="description"
        placeholder="Describe your product"
        required
      ></textarea>

      <label for="image">Product Image</label>

      <input
        type="file"
        id="image"
        accept="image/*"
        required
      >

      <div class="image-help">
        Choose a clear photo of the product from your phone.
      </div>

      <label for="store">Store / Business Name</label>

      <input
        type="text"
        id="store"
        placeholder="Your store name"
        required
      >

      <button type="submit" id="submitButton">
        Add Product
      </button>

    </form>

    <div id="message" class="message"></div>

    <a class="back" href="dashboard.html">
      ← Back to Seller Dashboard
    </a>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function checkSeller() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    window.location.href = "login.html";
    return null;
  }

  return user;
}


async function loadSeller() {

  const user = await checkSeller();

  if (!user) return;

  const storeName =
    user.user_metadata?.store_name || "";

  document.getElementById("store").value =
    storeName;
}


loadSeller();


document
  .getElementById("productForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const submitButton =
        document.getElementById("submitButton");

      const message =
        document.getElementById("message");

      submitButton.disabled = true;

      submitButton.textContent =
        "Uploading...";

      message.style.display = "none";


      try {

        const {
          data: { user },
          error: userError
        } = await supabaseClient.auth.getUser();


        if (userError || !user) {

          window.location.href =
            "login.html";

          return;
        }


        const name =
          document
            .getElementById("name")
            .value
            .trim();


        const price =
          Number(
            document
              .getElementById("price")
              .value
          );


        const description =
          document
            .getElementById("description")
            .value
            .trim();


        const store =
          document
            .getElementById("store")
            .value
            .trim();


        const imageFile =
          document
            .getElementById("image")
            .files[0];


        if (!imageFile) {

          throw new Error(
            "Please select a product image."
          );

        }


        if (imageFile.size > 5 * 1024 * 1024) {

          throw new Error(
            "Image is too large. Please choose an image below 5MB."
          );

        }


        const safeFileName =
          imageFile.name
            .replace(
              /[^a-zA-Z0-9.-]/g,
              "-"
            );


        const filePath =
          user.id +
          "/" +
          Date.now() +
          "-" +
          safeFileName;


        /*
          Upload image to Supabase Storage
        */

        const {
          error: uploadError
        } =
          await supabaseClient
            .storage
            .from("products")
            .upload(
              filePath,
              imageFile,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (uploadError) {

          throw uploadError;

        }


        /*
          Get public image URL
        */

        const {
          data: publicUrlData
        } =
          supabaseClient
            .storage
            .from("products")
            .getPublicUrl(
              filePath
            );


        const imageUrl =
          publicUrlData.publicUrl;


        /*
          Save product to database
        */

        const {
          error: insertError
        } =
          await supabaseClient
            .from("products")
            .insert([
              {
                name: name,
                price: price,
                description: description,
                store: store,
                seller_id: user.id,
                image_url: imageUrl
              }
            ]);


        if (insertError) {

          throw insertError;

        }


        message.className =
          "message success";

        message.style.display =
          "block";

        message.innerHTML =
          "Product added successfully! 🎉";


        document
          .getElementById("productForm")
          .reset();


        document
          .getElementById("store")
          .value =
          user.user_metadata?.store_name ||
          store;


        submitButton.disabled = false;

        submitButton.textContent =
          "Add Product";


      } catch (error) {

        console.error(error);


        message.className =
          "message error";

        message.style.display =
          "block";


        message.innerHTML =
          "Unable to add product.<br>" +
          (
            error.message ||
            "Please try again."
          );


        submitButton.disabled = false;

        submitButton.textContent =
          "Add Product";

      }

    }
  );

</script>

</body>
</html>
