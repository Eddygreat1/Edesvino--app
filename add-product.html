<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edesvino - Add Product</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
}

.header {
  background: #111827;
  color: white;
  padding: 25px;
  border-radius: 12px;
  text-align: center;
}

.card {
  background: white;
  padding: 20px;
  margin-top: 15px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input,
textarea {
  width: 100%;
  padding: 14px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border: none;
  border-radius: 8px;
  background: #111827;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

.message {
  margin-top: 20px;
  padding: 15px;
  border-radius: 8px;
  display: none;
}

.success {
  background: #ecfdf5;
  color: #065f46;
}

.error {
  background: #fef2f2;
  color: #991b1b;
}

.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #111827;
  font-weight: bold;
  text-decoration: none;
}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>Edesvino</h1>

    <p>Add Product</p>

  </div>


  <div class="card">

    <form id="productForm">

      <label for="name">
        Product Name
      </label>

      <input
        type="text"
        id="name"
        placeholder="Enter product name"
        required
      >


      <label for="price">
        Price (₦)
      </label>

      <input
        type="number"
        id="price"
        placeholder="Enter price"
        min="0"
        required
      >


      <label for="description">
        Product Description
      </label>

      <textarea
        id="description"
        placeholder="Describe your product"
        required
      ></textarea>


      <label for="store">
        Store / Business Name
      </label>

      <input
        type="text"
        id="store"
        placeholder="Enter store name"
        required
      >


      <button
        type="submit"
        id="addButton">

        Add Product

      </button>

    </form>


    <div
      id="message"
      class="message">
    </div>


    <a
      class="back"
      href="dashboard.html">

      ← Back to Seller Dashboard

    </a>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const form =
document.getElementById("productForm");

const button =
document.getElementById("addButton");

const message =
document.getElementById("message");


async function checkSeller() {

  const {
    data,
    error
  } =
  await supabaseClient.auth.getUser();


  if (error || !data.user) {

    window.location.replace("login.html");

    return null;

  }


  return data.user;

}


async function loadSeller() {

  const user =
  await checkSeller();


  if (!user) {
    return;
  }


  const storeName =
  user.user_metadata?.store_name || "";


  document.getElementById("store").value =
  storeName;

}


loadSeller();


form.addEventListener(
"submit",
async function(event) {

  event.preventDefault();


  button.disabled = true;

  button.textContent =
  "Adding Product...";


  message.style.display =
  "block";

  message.className =
  "message";

  message.textContent =
  "Adding product...";


  const user =
  await checkSeller();


  if (!user) {
    return;
  }


  const name =
  document.getElementById("name")
  .value.trim();


  const price =
  Number(
    document.getElementById("price").value
  );


  const description =
  document.getElementById("description")
  .value.trim();


  const store =
  document.getElementById("store")
  .value.trim();


  const {
    error
  } =
  await supabaseClient
    .from("products")
    .insert([
      {
        name: name,
        price: price,
        description: description,
        store: store,
        seller_id: user.id
      }
    ]);


  if (error) {

    message.className =
    "message error";

    message.textContent =
    "Product failed: " +
    error.message;

    button.disabled =
    false;

    button.textContent =
    "Add Product";

    return;

  }


  message.className =
  "message success";

  message.textContent =
  "Product added successfully!";


  form.reset();


  document.getElementById("store").value =
  user.user_metadata?.store_name || "";


  button.disabled =
  false;

  button.textContent =
  "Add Product";

});

</script>

</body>
</html>
