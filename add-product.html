

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product - Edesvino</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
}

.header {
  background: #111827;
  color: white;
  padding: 25px;
  text-align: center;
  border-radius: 12px;
}

.card {
  background: white;
  padding: 20px;
  margin-top: 15px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  box-sizing: border-box;
  font-size: 16px;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button,
a {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  border: none;
  border-radius: 8px;
  background: #111827;
  color: white;
  text-align: center;
  text-decoration: none;
  font-size: 16px;
  box-sizing: border-box;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

.back {
  background: #e5e7eb;
  color: #111827;
}

.success {
  display: none;
  margin-top: 20px;
  padding: 15px;
  background: #ecfdf5;
  border: 1px solid #10b981;
  border-radius: 8px;
  color: #065f46;
  text-align: center;
}

.error {
  display: none;
  margin-top: 20px;
  padding: 15px;
  background: #fef2f2;
  border: 1px solid #ef4444;
  border-radius: 8px;
  color: #991b1b;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Edesvino</h1>
    <p>Add Product</p>
  </div>

  <div class="card">

    <form id="productForm">

      <label for="productName">Product Name</label>
      <input
        type="text"
        id="productName"
        placeholder="Enter product name"
        required
      >

      <label for="price">Price (₦)</label>
      <input
        type="number"
        id="price"
        placeholder="Enter product price"
        min="0"
        required
      >

      <label for="description">Product Description</label>
      <textarea
        id="description"
        placeholder="Describe your product"
        required
      ></textarea>

      <label for="store">Store Name</label>
      <input
        type="text"
        id="store"
        placeholder="Enter your store name"
        required
      >

      <button type="submit" id="addButton">
        Add Product
      </button>

    </form>

    <div class="success" id="successMessage">
      Product added successfully!
    </div>

    <div class="error" id="errorMessage"></div>

    <a href="dashboard.html" class="back">
      ← Back to Seller Dashboard
    </a>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY = "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// Load seller's store name
const sellerData = localStorage.getItem("edesvinoSeller");

const storeInput = document.getElementById("store");

if (sellerData) {
  try {
    const seller = JSON.parse(sellerData);
    storeInput.value = seller.store || "";
  } catch (error) {
    console.error("Seller data error:", error);
  }
}


// Add product to Supabase
document.getElementById("productForm").addEventListener("submit", async function(event) {

  event.preventDefault();

  const productName = document.getElementById("productName").value.trim();
  const price = document.getElementById("price").value;
  const description = document.getElementById("description").value.trim();
  const store = document.getElementById("store").value.trim();

  const successMessage = document.getElementById("successMessage");
  const errorMessage = document.getElementById("errorMessage");
  const addButton = document.getElementById("addButton");

  successMessage.style.display = "none";
  errorMessage.style.display = "none";

  if (!productName || !price || !description || !store) {
    errorMessage.textContent = "Please fill in all product details.";
    errorMessage.style.display = "block";
    return;
  }

  addButton.disabled = true;
  addButton.textContent = "Adding Product...";

  const { data, error } = await supabaseClient
    .from("products")
    .insert([
      {
        name: productName,
        price: Number(price),
        description: description,
        store: store
      }
    ])
    .select();

  if (error) {

    console.error("Supabase error:", error);

    errorMessage.textContent =
      "Product could not be added: " + error.message;

    errorMessage.style.display = "block";

    addButton.disabled = false;
    addButton.textContent = "Add Product";

    return;
  }

  // Product successfully saved
  document.getElementById("productForm").reset();

  if (sellerData) {
    try {
      const seller = JSON.parse(sellerData);
      storeInput.value = seller.store || "";
    } catch (error) {
      console.error("Seller data error:", error);
    }
  }

  successMessage.textContent = "Product added successfully!";
  successMessage.style.display = "block";

  addButton.disabled = false;
  addButton.textContent = "Add Product";

});
</script>

</body>
</html>
