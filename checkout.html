<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout - Edesvino</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 16px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-right: 14px;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    .item {
      border-bottom: 1px solid #ddd;
      padding: 14px 0;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item-name {
      font-weight: bold;
      font-size: 17px;
    }

    .store {
      color: #666;
      font-size: 14px;
      margin-top: 4px;
    }

    .item-price {
      margin-top: 7px;
      font-weight: bold;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 7px 0;
    }

    .total {
      border-top: 2px solid #ddd;
      margin-top: 10px;
      padding-top: 12px;
      font-size: 19px;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 7px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      display: none;
    }

    .success {
      background: #e7f7e7;
      color: #176b17;
    }

    .error {
      background: #ffeaea;
      color: #a00000;
    }

    #trackLink {
      display: none;
      margin-top: 15px;
      text-align: center;
    }

    #trackLink a {
      display: inline-block;
      padding: 12px 18px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>Edesvino</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="cart.html">Cart</a>
    <a href="register.html">Sell</a>
    <a href="track-order.html">Track Order</a>
  </nav>
</header>

<div class="container">

  <div class="box">
    <h2>Checkout</h2>
    <div id="productBox">
      <div class="loading">Loading order...</div>
    </div>
  </div>

  <div class="box">

    <h2>Delivery Details</h2>

    <label for="customerName">Full Name</label>
    <input type="text" id="customerName" placeholder="Enter your full name">

    <label for="customerPhone">Phone Number</label>
    <input type="tel" id="customerPhone" placeholder="Enter your phone number">

    <label for="deliveryAddress">Delivery Address</label>
    <textarea id="deliveryAddress" placeholder="Enter your delivery address"></textarea>

    <button id="payButton">Pay with Paystack</button>

    <div id="message"></div>

    <div id="trackLink">
      <a href="track-order.html">Track Your Order</a>
    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const EDGE_FUNCTION_URL =
  SUPABASE_URL + "/functions/v1/smart-task";

const VERIFY_FUNCTION_URL =
  SUPABASE_URL + "/functions/v1/quick-function";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let checkoutItems = [];
let checkoutTotal = 0;
let currentUser = null;
let isCartCheckout = false;


/* =========================
   HELPERS
========================= */

function formatPrice(amount) {
  return "₦" + Number(amount || 0).toLocaleString();
}

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getCart() {
  try {
    const cart = JSON.parse(
      localStorage.getItem("edesvinoCart") || "[]"
    );

    return Array.isArray(cart) ? cart : [];
  } catch (error) {
    return [];
  }
}

function showMessage(message, type = "error") {
  const box = document.getElementById("message");

  box.textContent = message;
  box.className = type;
  box.style.display = "block";
}


/* =========================
   LOAD CHECKOUT
========================= */

async function loadCheckout() {

  const params =
    new URLSearchParams(window.location.search);

  const productName =
    params.get("product");

  const cart =
    getCart();

  /*
    IMPORTANT:
    If the cart contains items, use the cart directly.
    This avoids the failed product lookup that caused
    the previous cart -> checkout problem.
  */

  if (cart.length > 0) {

    isCartCheckout = true;

    checkoutItems =
      cart
        .filter(item => item && item.name)
        .map(item => ({
          id: item.id || null,
          name: item.name,
          description: item.description || "",
          price: Number(item.price || 0),
          quantity: Math.max(
            1,
            Number(item.quantity || 1)
          ),
          seller_id: item.seller_id || null,
          store:
            item.store === "Edesvino"
              ? "Eddy Digital Hub"
              : (item.store || "Eddy Digital Hub"),
          image: item.image || ""
        }));

  } else if (productName) {

    /*
      Buy Now:
      load the single product from Supabase.
    */

    isCartCheckout = false;

    const { data, error } =
      await supabaseClient
        .from("products")
        .select("*")
        .eq("name", productName)
        .limit(1)
        .maybeSingle();

    if (error || !data) {

      document.getElementById("productBox").innerHTML =
        "<p>Product unavailable.</p>";

      document.getElementById("payButton").disabled = true;

      return;
    }

    checkoutItems = [
      {
        id: data.id,
        name: data.name,
        description: data.description || "",
        price: Number(data.price || 0),
        quantity: 1,
        seller_id: data.seller_id || null,
        store:
          data.store === "Edesvino"
            ? "Eddy Digital Hub"
            : (data.store || "Eddy Digital Hub"),
        image: data.image || ""
      }
    ];

  } else {

    document.getElementById("productBox").innerHTML =
      "<p>Your cart is empty.</p>";

    document.getElementById("payButton").disabled = true;

    return;
  }


  if (!checkoutItems.length) {

    document.getElementById("productBox").innerHTML =
      "<p>No products available for checkout.</p>";

    document.getElementById("payButton").disabled = true;

    return;
  }


  renderCheckout();
}


/* =========================
   RENDER CHECKOUT
========================= */

function renderCheckout() {

  const box =
    document.getElementById("productBox");

  checkoutTotal = 0;

  let html = "";

  checkoutItems.forEach(item => {

    const itemTotal =
      item.price * item.quantity;

    checkoutTotal += itemTotal;

    html += `
      <div class="item">

        <div class="item-name">
          ${escapeHTML(item.name)}
        </div>

        <div class="store">
          Store: ${escapeHTML(item.store)}
        </div>

        <div class="item-price">
          ${formatPrice(item.price)}
        </div>

        <div class="summary-row">
          <span>Quantity</span>
          <span>${item.quantity}</span>
        </div>

        <div class="summary-row">
          <span>Item total</span>
          <strong>${formatPrice(itemTotal)}</strong>
        </div>

      </div>
    `;
  });


  html += `
    <div class="summary-row">
      <span>Subtotal</span>
      <strong>${formatPrice(checkoutTotal)}</strong>
    </div>

    <div class="summary-row">
      <span>Delivery</span>
      <span>Calculated at checkout</span>
    </div>

    <div class="summary-row total">
      <span>Total</span>
      <span>${formatPrice(checkoutTotal)}</span>
    </div>
  `;

  box.innerHTML = html;
}


/* =========================
   CREATE ORDER
========================= */

async function createOrder(paymentResult) {

  const reference =
    paymentResult.reference;

  const idempotencyKey =
    "edesvinoPayment_" + reference;

  const existingOrderId =
    sessionStorage.getItem(idempotencyKey);

  if (existingOrderId) {
    return existingOrderId;
  }

  if (!checkoutItems.length) {
    throw new Error("No checkout items found.");
  }


  const customerName =
    document.getElementById("customerName")
      .value.trim();

  const customerPhone =
    document.getElementById("customerPhone")
      .value.trim();

  const deliveryAddress =
    document.getElementById("deliveryAddress")
      .value.trim();


  const productSummary =
    checkoutItems
      .map(item => {

        if (item.quantity > 1) {
          return item.name + " x" + item.quantity;
        }

        return item.name;

      })
      .join(", ");


  const mainSellerId =
    checkoutItems[0].seller_id || null;


  const { data: order, error: orderError } =
    await supabaseClient
      .from("orders")
      .insert({
        product_name: productSummary,
        price: checkoutTotal,
        customer_name: customerName,
        customer_phone: customerPhone,
        delivery_address: deliveryAddress,
        seller_id: mainSellerId,
        customer_id: currentUser.id,
        status: "Pending"
      })
      .select("id")
      .single();


  if (orderError) {
    throw orderError;
  }


  const orderItems =
    checkoutItems.map(item => ({
      order_id: order.id,
      product_name: item.name,
      price: item.price,
      quantity: item.quantity,
      seller_id: item.seller_id || null
    }));


  const { error: itemError } =
    await supabaseClient
      .from("order_items")
      .insert(orderItems);


  if (itemError) {
    throw itemError;
  }


  sessionStorage.setItem(
    idempotencyKey,
    String(order.id)
  );


  if (isCartCheckout) {
    localStorage.removeItem("edesvinoCart");
  }


  return order.id;
}


/* =========================
   START PAYMENT
========================= */

async function startPayment() {

  try {

    document.getElementById("payButton")
      .disabled = true;


    const {
      data: {
        user
      },
      error: authError
    } =
      await supabaseClient.auth.getUser();


    if (authError || !user) {

      showMessage(
        "Please log in before making a payment."
      );

      document.getElementById("payButton")
        .disabled = false;

      return;
    }


    currentUser = user;


    const customerName =
      document.getElementById("customerName")
        .value.trim();

    const customerPhone =
      document.getElementById("customerPhone")
        .value.trim();

    const deliveryAddress =
      document.getElementById("deliveryAddress")
        .value.trim();


    if (!customerName) {
      showMessage("Please enter your full name.");
      document.getElementById("payButton").disabled = false;
      return;
    }

    if (!customerPhone) {
      showMessage("Please enter your phone number.");
      document.getElementById("payButton").disabled = false;
      return;
    }

    if (!deliveryAddress) {
      showMessage("Please enter your delivery address.");
      document.getElementById("payButton").disabled = false;
      return;
    }


    const checkoutData = {

      product_name:
        checkoutItems
          .map(item => item.name)
          .join(", "),

      price:
        checkoutTotal,

      seller_id:
        checkoutItems[0].seller_id || null,

      customer_id:
        user.id,

      customer_name:
        customerName,

      customer_phone:
        customerPhone,

      delivery_address:
        deliveryAddress,

      items:
        checkoutItems.map(item => ({
          id: item.id,
          name: item.name,
          price: item.price,
          quantity: item.quantity,
          seller_id: item.seller_id || null
        }))
    };


    sessionStorage.setItem(
      "edesvinoCheckout",
      JSON.stringify(checkoutData)
    );


    const response =
      await fetch(
        EDGE_FUNCTION_URL,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            action: "initialize_payment",

            amount:
              checkoutTotal,

            email:
              user.email,

            callback_url:
              window.location.href,

            metadata: {

              product_name:
                checkoutData.product_name,

              seller_id:
                checkoutData.seller_id,

              customer_id:
                checkoutData.customer_id,

              customer_name:
                checkoutData.customer_name,

              customer_phone:
                checkoutData.customer_phone,

              items:
                checkoutData.items
            }
          })
        }
      );


    const result =
      await response.json();


    if (!response.ok) {

      throw new Error(
        result.error ||
        result.message ||
        "Unable to initialize payment."
      );
    }


    const authorizationUrl =
      result.authorization_url ||
      result.authorizationUrl ||
      result.data?.authorization_url ||
      result.data?.authorizationUrl;


    if (!authorizationUrl) {

      throw new Error(
        "Paystack authorization URL was not returned."
      );
    }


    window.location.assign(
      authorizationUrl
    );


  } catch (error) {

    console.error(error);

    showMessage(
      error.message ||
      "Unable to start payment."
    );

    document.getElementById("payButton")
      .disabled = false;
  }
}


/* =========================
   VERIFY PAYMENT
========================= */

async function verifyPayment() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const reference =
    params.get("reference") ||
    params.get("trxref");


  if (!reference) {
    return;
  }


  try {

    showMessage(
      "Verifying your payment...",
      "success"
    );


    const response =
      await fetch(
        VERIFY_FUNCTION_URL,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            reference: reference
          })
        }
      );


    const result =
      await response.json();


    if (!response.ok) {

      throw new Error(
        result.error ||
        result.message ||
        "Payment verification failed."
      );
    }


    if (!result.success || !result.paid) {

      throw new Error(
        "Payment could not be confirmed."
      );
    }


    const savedCheckout =
      sessionStorage.getItem(
        "edesvinoCheckout"
      );


    if (!savedCheckout) {

      throw new Error(
        "Checkout information was not found."
      );
    }


    const checkoutData =
      JSON.parse(savedCheckout);


    checkoutItems =
      (checkoutData.items || []).map(item => ({
        id: item.id || null,
        name: item.name,
        price: Number(item.price || 0),
        quantity: Math.max(
          1,
          Number(item.quantity || 1)
        ),
        seller_id: item.seller_id || null,
        store: "Eddy Digital Hub"
      }));


    checkoutTotal =
      Number(checkoutData.price || 0);


    const {
      data: {
        user
      }
    } =
      await supabaseClient.auth.getUser();


    if (!user) {
      throw new Error(
        "Your login session has expired."
      );
    }


    currentUser = user;


    document.getElementById("customerName")
      .value =
      checkoutData.customer_name || "";

    document.getElementById("customerPhone")
      .value =
      checkoutData.customer_phone || "";

    document.getElementById("deliveryAddress")
      .value =
      checkoutData.delivery_address || "";


    const paymentResult = {

      reference:
        reference,

      amount:
        Number(
          result.amount ||
          checkoutTotal * 100
        ),

      status:
        result.status || "success"
    };


    const orderId =
      await createOrder(
        paymentResult
      );


    document.getElementById("productBox")
      .innerHTML = `
        <div class="success">
          <strong>Payment successful!</strong>
          <br><br>
          Order #${escapeHTML(orderId)}
          <br>
          Total: ${formatPrice(checkoutTotal)}
        </div>
      `;


    document.getElementById("payButton")
      .style.display = "none";


    showMessage(
      "Your order has been created successfully.",
      "success"
    );


    document.getElementById("trackLink")
      .style.display = "block";


    window.history.replaceState(
      {},
      document.title,
      "checkout.html"
    );


    sessionStorage.removeItem(
      "edesvinoCheckout"
    );


  } catch (error) {

    console.error(error);

    showMessage(
      error.message ||
      "There was a problem confirming your payment."
    );

    document.getElementById("payButton")
      .disabled = false;
  }
}


/* =========================
   BUTTON
========================= */

document.getElementById("payButton")
  .addEventListener(
    "click",
    startPayment
  );


/* =========================
   PAGE LOAD
========================= */

(async function() {

  await loadCheckout();

  await verifyPayment();

})();

</script>

</body>
</html>
