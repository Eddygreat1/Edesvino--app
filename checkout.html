<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Edesvino Checkout</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
    }

    .header-content {
      max-width: 900px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1,
    h2 {
      margin-top: 0;
    }

    .checkout-item {
      border-bottom: 1px solid #eee;
      padding: 15px 0;
    }

    .checkout-item:last-child {
      border-bottom: none;
    }

    .item-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .item-store {
      color: #666;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .item-price {
      font-size: 15px;
      margin-bottom: 5px;
    }

    .item-quantity {
      color: #555;
      font-size: 14px;
    }

    .item-total {
      font-weight: bold;
      margin-top: 7px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 0;
    }

    .summary-total {
      border-top: 1px solid #ddd;
      margin-top: 10px;
      padding-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #111;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .error {
      background: #ffe8e8;
      color: #a00000;
    }

    .success {
      background: #e7f8e7;
      color: #176b17;
    }

    .loading {
      text-align: center;
      padding: 30px;
      background: white;
      border-radius: 10px;
    }

    .empty {
      text-align: center;
      padding: 30px;
      background: white;
      border-radius: 10px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #111;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .header-content {
        flex-direction: column;
      }

      nav a {
        margin: 0 6px;
      }

      .container {
        margin-top: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-content">

    <div class="logo">
      Edesvino
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="cart.html">Cart</a>
      <a href="track-order.html">Track Order</a>
    </nav>

  </div>
</header>

<div class="container">

  <a class="back-link" href="cart.html">
    ← Back to Cart
  </a>

  <div id="message" class="message"></div>

  <div id="loading" class="loading">
    Loading checkout...
  </div>

  <div id="checkoutContent" style="display:none;">

    <div class="card">

      <h1>Checkout</h1>

      <div id="checkoutItems"></div>

    </div>

    <div class="card">

      <h2>Order Summary</h2>

      <div class="summary-row">
        <span>Subtotal</span>
        <strong id="subtotal">₦0</strong>
      </div>

      <div class="summary-row">
        <span>Delivery</span>
        <span>Calculated at checkout</span>
      </div>

      <div class="summary-row summary-total">
        <span>Total</span>
        <span id="total">₦0</span>
      </div>

    </div>

    <div class="card">

      <h2>Customer Details</h2>

      <label for="customerName">
        Full Name
      </label>

      <input
        type="text"
        id="customerName"
        placeholder="Enter your full name"
        autocomplete="name"
      >

      <label for="customerPhone">
        Phone Number
      </label>

      <input
        type="tel"
        id="customerPhone"
        placeholder="Enter your phone number"
        autocomplete="tel"
      >

      <label for="deliveryAddress">
        Delivery Address
      </label>

      <textarea
        id="deliveryAddress"
        placeholder="Enter your complete delivery address"
        autocomplete="street-address"
      ></textarea>

      <button
        id="payButton"
        onclick="startPayment()"
      >
        Pay with Paystack
      </button>

    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const SUPABASE_FUNCTION_URL =
  SUPABASE_URL +
  "/functions/v1/smart-task";


const QUICK_FUNCTION_URL =
  SUPABASE_URL +
  "/functions/v1/quick-function";


let checkoutItems = [];

let checkoutTotal = 0;

let isCartCheckout = false;


function naira(amount) {

  return "₦" +
    Number(amount || 0).toLocaleString("en-NG");

}


function showMessage(message, type = "error") {

  const box =
    document.getElementById("message");

  box.textContent = message;

  box.className =
    "message " + type;

  box.style.display = "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function hideMessage() {

  const box =
    document.getElementById("message");

  box.style.display = "none";

}


function getCart() {

  try {

    const saved =
      localStorage.getItem("edesvinoCart");

    if (!saved) {
      return [];
    }

    const cart =
      JSON.parse(saved);

    if (!Array.isArray(cart)) {
      return [];
    }

    return cart;

  } catch (error) {

    console.error(error);

    return [];

  }

}


function saveCheckoutData() {

  const data = {

    items: checkoutItems,

    total: checkoutTotal,

    customerName:
      document.getElementById("customerName").value.trim(),

    customerPhone:
      document.getElementById("customerPhone").value.trim(),

    deliveryAddress:
      document.getElementById("deliveryAddress").value.trim(),

    isCartCheckout

  };

  sessionStorage.setItem(
    "edesvinoCheckout",
    JSON.stringify(data)
  );

}


function renderCheckout() {

  const container =
    document.getElementById("checkoutItems");

  if (
    !checkoutItems ||
    checkoutItems.length === 0
  ) {

    document.getElementById("loading").style.display =
      "none";

    document.getElementById("checkoutContent").style.display =
      "none";

    showMessage(
      "Your cart is empty.",
      "error"
    );

    return;
  }


  container.innerHTML = "";

  let subtotal = 0;


  checkoutItems.forEach(item => {

    const price =
      Number(item.price || 0);

    const quantity =
      Math.max(
        1,
        Number(item.quantity || 1)
      );

    const itemTotal =
      price * quantity;

    subtotal += itemTotal;


    const itemDiv =
      document.createElement("div");

    itemDiv.className =
      "checkout-item";


    itemDiv.innerHTML = `
      <div class="item-name">
        ${escapeHTML(item.name)}
      </div>

      <div class="item-store">
        Store:
        ${escapeHTML(
          item.store ||
          "Eddy Digital Hub"
        )}
      </div>

      <div class="item-price">
        Price:
        ${naira(price)}
      </div>

      <div class="item-quantity">
        Quantity:
        ${quantity}
      </div>

      <div class="item-total">
        Item total:
        ${naira(itemTotal)}
      </div>
    `;


    container.appendChild(itemDiv);

  });


  checkoutTotal = subtotal;


  document.getElementById("subtotal").textContent =
    naira(subtotal);

  document.getElementById("total").textContent =
    naira(subtotal);


  document.getElementById("loading").style.display =
    "none";

  document.getElementById("checkoutContent").style.display =
    "block";

}


function escapeHTML(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


async function loadCheckout() {

  try {

    hideMessage();


    const params =
      new URLSearchParams(
        window.location.search
      );

    const productName =
      params.get("product");


    const cart =
      getCart();


    /*
      CART CHECKOUT
      Use the products already stored
      in localStorage.
    */

    if (cart.length > 0) {

      isCartCheckout = true;


      checkoutItems =
        cart
          .filter(
            item =>
              item &&
              item.name
          )
          .map(item => ({

            id:
              item.id ||
              null,

            name:
              item.name,

            description:
              item.description ||
              "",

            price:
              Number(
                item.price || 0
              ),

            quantity:
              Math.max(
                1,
                Number(
                  item.quantity || 1
                )
              ),

            seller_id:
              item.seller_id ||
              null,

            store:
              item.store === "Edesvino"
                ? "Eddy Digital Hub"
                : (
                    item.store ||
                    "Eddy Digital Hub"
                  ),

            image:
              item.image ||
              ""

          }));


      renderCheckout();

      return;

    }


    /*
      BUY NOW CHECKOUT
      If there is no cart, load
      the requested product from Supabase.
    */

    if (productName) {

      isCartCheckout = false;


      const {
        data,
        error
      } = await supabaseClient
        .from("products")
        .select(
          "id,name,price,description,store,image_url,seller_id"
        )
        .eq(
          "name",
          productName
        )
        .limit(1)
        .maybeSingle();


      if (error) {

        console.error(error);

        throw new Error(
          "Unable to load this product."
        );

      }


      if (!data) {

        throw new Error(
          "Product unavailable."
        );

      }


      checkoutItems = [{

        id:
          data.id,

        name:
          data.name,

        description:
          data.description ||
          "",

        price:
          Number(
            data.price || 0
          ),

        quantity: 1,

        seller_id:
          data.seller_id ||
          null,

        store:
          data.store === "Edesvino"
            ? "Eddy Digital Hub"
            : (
                data.store ||
                "Eddy Digital Hub"
              ),

        image:
          data.image_url ||
          ""

      }];


      renderCheckout();

      return;

    }


    document.getElementById("loading").style.display =
      "none";

    showMessage(
      "No product or cart items were found.",
      "error"
    );


  } catch (error) {

    console.error(error);


    document.getElementById("loading").style.display =
      "none";

    showMessage(
      error.message ||
      "Unable to load checkout.",
      "error"
    );

  }

}


async function startPayment() {

  try {

    hideMessage();


    if (
      !checkoutItems ||
      checkoutItems.length === 0
    ) {

      showMessage(
        "There are no products to pay for."
      );

      return;

    }


    if (
      !checkoutTotal ||
      checkoutTotal <= 0
    ) {

      showMessage(
        "A valid payment amount is required."
      );

      return;

    }


    const customerName =
      document
        .getElementById("customerName")
        .value
        .trim();


    const customerPhone =
      document
        .getElementById("customerPhone")
        .value
        .trim();


    const deliveryAddress =
      document
        .getElementById("deliveryAddress")
        .value
        .trim();


    if (!customerName) {

      showMessage(
        "Please enter your full name."
      );

      return;

    }


    if (!customerPhone) {

      showMessage(
        "Please enter your phone number."
      );

      return;

    }


    if (!deliveryAddress) {

      showMessage(
        "Please enter your delivery address."
      );

      return;

    }


    const payButton =
      document.getElementById("payButton");


    payButton.disabled = true;

    payButton.textContent =
      "Preparing payment...";


    const {
      data: {
        user
      },
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (userError || !user) {

      payButton.disabled = false;

      payButton.textContent =
        "Pay with Paystack";


      showMessage(
        "Please log in before making payment."
      );

      return;

    }


    saveCheckoutData();


    const productSummary =
      checkoutItems
        .map(item => {

          const quantity =
            Math.max(
              1,
              Number(
                item.quantity || 1
              )
            );

          return quantity > 1
            ? `${item.name} x${quantity}`
            : item.name;

        })
        .join(", ");


    /*
      IMPORTANT:
      smart-task expects:
      action: "initialize"

      It converts the amount from
      naira to kobo itself.
    */

    const response =
      await fetch(
        SUPABASE_FUNCTION_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          },

          body:
            JSON.stringify({

              action:
                "initialize",

              amount:
                checkoutTotal,

              email:
                user.email,

              callback_url:
                window.location.href,

              metadata: {

                customer_name:
                  customerName,

                customer_phone:
                  customerPhone,

                delivery_address:
                  deliveryAddress,

                product_name:
                  productSummary,

                items:
                  checkoutItems.map(
                    item => ({

                      name:
                        item.name,

                      price:
                        Number(
                          item.price || 0
                        ),

                      quantity:
                        Math.max(
                          1,
                          Number(
                            item.quantity || 1
                          )
                        ),

                      seller_id:
                        item.seller_id ||
                        null

                    })
                  )

              }

            })

        }
      );


    const result =
      await response.json();


    console.log(
      "smart-task response:",
      result
    );


    if (!response.ok) {

      throw new Error(
        result.message ||
        result.error ||
        "Unable to initialize payment."
      );

    }


    /*
      Accept common Paystack response formats.
    */

    const authorizationUrl =
      result.authorization_url ||
      result.authorizationUrl ||
      result.data?.authorization_url ||
      result.data?.authorizationUrl;


    if (!authorizationUrl) {

      console.error(
        "Unexpected payment response:",
        result
      );

      throw new Error(
        result.message ||
        "Payment link was not returned."
      );

    }


    window.location.href =
      authorizationUrl;


  } catch (error) {

    console.error(error);


    const payButton =
      document.getElementById("payButton");


    payButton.disabled = false;

    payButton.textContent =
      "Pay with Paystack";


    showMessage(
      error.message ||
      "Unable to start payment."
    );

  }

}


async function verifyPayment(
  reference
) {

  try {

    const response =
      await fetch(
        QUICK_FUNCTION_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          },

          body:
            JSON.stringify({
              reference
            })

        }
      );


    const result =
      await response.json();


    console.log(
      "quick-function response:",
      result
    );


    if (!response.ok) {

      throw new Error(
        result.message ||
        result.error ||
        "Payment verification failed."
      );

    }


    return result;


  } catch (error) {

    console.error(error);

    throw error;

  }

}


async function createOrder(
  paymentResult
) {

  const {
    data: {
      user
    },
    error: userError
  } =
    await supabaseClient.auth.getUser();


  if (userError || !user) {

    throw new Error(
      "Unable to identify customer."
    );

  }


  const customerName =
    document
      .getElementById("customerName")
      .value
      .trim();


  const customerPhone =
    document
      .getElementById("customerPhone")
      .value
      .trim();


  const deliveryAddress =
    document
      .getElementById("deliveryAddress")
      .value
      .trim();


  const productSummary =
    checkoutItems
      .map(item => {

        const quantity =
          Math.max(
            1,
            Number(
              item.quantity || 1
            )
          );

        return quantity > 1
          ? `${item.name} x${quantity}`
          : item.name;

      })
      .join(", ");


  /*
    Prevent duplicate orders if
    Paystack callback is refreshed.
  */

  const reference =
    paymentResult?.reference ||
    paymentResult?.data?.reference ||
    "";


  const idempotencyKey =
    reference
      ? "edesvinoPayment_" +
        reference
      : null;


  if (idempotencyKey) {

    const {
      data: existingOrder,
      error: existingError
    } =
      await supabaseClient
        .from("orders")
        .select("*")
        .eq(
          "idempotency_key",
          idempotencyKey
        )
        .maybeSingle();


    /*
      Some existing versions of the
      orders table may not have the
      idempotency_key column.

      If the query fails because the
      column does not exist, continue.
    */

    if (
      !existingError &&
      existingOrder
    ) {

      return existingOrder;

    }

  }


  const orderData = {

    product_name:
      productSummary,

    price:
      checkoutTotal,

    customer_name:
      customerName,

    customer_phone:
      customerPhone,

    delivery_address:
      deliveryAddress,

    seller_id:
      checkoutItems[0]?.seller_id ||
      null,

    customer_id:
      user.id,

    status:
      "Pending"

  };


  const {
    data: order,
    error: orderError
  } =
    await supabaseClient
      .from("orders")
      .insert(
        orderData
      )
      .select()
      .single();


  if (orderError) {

    console.error(
      "Order creation error:",
      orderError
    );

    throw new Error(
      orderError.message ||
      "Unable to create order."
    );

  }


  /*
    Save individual cart products
    into order_items.
  */

  const orderItems =
    checkoutItems.map(item => ({

      order_id:
        order.id,

      product_name:
        item.name,

      price:
        Number(
          item.price || 0
        ),

      quantity:
        Math.max(
          1,
          Number(
            item.quantity || 1
          )
        ),

      seller_id:
        item.seller_id ||
        null

    }));


  const {
    error: itemsError
  } =
    await supabaseClient
      .from("order_items")
      .insert(
        orderItems
      );


  if (itemsError) {

    console.error(
      "Order items error:",
      itemsError
    );

    /*
      Do not delete the parent order.
      The payment has already succeeded.
    */

    throw new Error(
      "Order was created, but the individual order items could not be saved. Please contact support."
    );

  }


  /*
    Only clear the cart when this
    checkout actually came from the cart.
  */

  if (isCartCheckout) {

    localStorage.removeItem(
      "edesvinoCart"
    );

  }


  return order;

}


async function handlePaymentCallback() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const reference =
    params.get("reference") ||
    params.get("trxref");


  if (!reference) {

    return;

  }


  try {

    document.getElementById("loading").style.display =
      "none";

    document.getElementById("checkoutContent").style.display =
      "none";


    showMessage(
      "Verifying your payment...",
      "success"
    );


    const verification =
      await verifyPayment(
        reference
      );


    const paymentData =
      verification?.data ||
      verification;


    const paymentStatus =
      String(
        paymentData?.status ||
        ""
      ).toLowerCase();


    if (
      paymentStatus &&
      paymentStatus !== "success"
    ) {

      throw new Error(
        "Payment was not successful."
      );

    }


    const checkoutDataRaw =
      sessionStorage.getItem(
        "edesvinoCheckout"
      );


    if (checkoutDataRaw) {

      const savedData =
        JSON.parse(
          checkoutDataRaw
        );


      if (
        savedData.items &&
        Array.isArray(
          savedData.items
        )
      ) {

        checkoutItems =
          savedData.items;

      }


      if (
        savedData.total
      ) {

        checkoutTotal =
          Number(
            savedData.total
          );

      }


      if (
        savedData.customerName
      ) {

        document
          .getElementById(
            "customerName"
          )
          .value =
            savedData.customerName;

      }


      if (
        savedData.customerPhone
      ) {

        document
          .getElementById(
            "customerPhone"
          )
          .value =
            savedData.customerPhone;

      }


      if (
        savedData.deliveryAddress
      ) {

        document
          .getElementById(
            "deliveryAddress"
          )
          .value =
            savedData.deliveryAddress;

      }


      if (
        typeof savedData.isCartCheckout ===
        "boolean"
      ) {

        isCartCheckout =
          savedData.isCartCheckout;

      }

    }


    const order =
      await createOrder({

        reference,

        data:
          paymentData

      });


    sessionStorage.removeItem(
      "edesvinoCheckout"
    );


    document.getElementById("checkoutContent").style.display =
      "block";


    showMessage(
      "Payment successful! Your order has been created. Order #" +
      order.id,
      "success"
    );


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });


  } catch (error) {

    console.error(error);


    showMessage(
      error.message ||
      "Payment verification failed."
    );

  }

}


loadCheckout();

handlePaymentCallback();

</script>

</body>
</html>
