<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout - Edesvino</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    .product {
      background: #f9fafb;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .product-name {
      font-size: 20px;
      font-weight: bold;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin-top: 8px;
    }

    .store {
      margin-top: 8px;
      color: #555;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #16a34a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    .message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      background: #e0f2fe;
      color: #075985;
    }

    .track-link {
      display: block;
      margin-top: 15px;
      text-align: center;
      background: #111827;
      color: white;
      padding: 13px;
      border-radius: 8px;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>Edesvino</h1>
</header>

<div class="container">

  <div class="card">

    <h2>Checkout</h2>

    <div id="productBox" class="product">
      Loading product...
    </div>

    <form id="checkoutForm">

      <label for="customerName">
        Full Name
      </label>

      <input
        type="text"
        id="customerName"
        required
      >

      <label for="customerPhone">
        Phone Number
      </label>

      <input
        type="tel"
        id="customerPhone"
        required
      >

      <label for="deliveryAddress">
        Delivery Address
      </label>

      <textarea
        id="deliveryAddress"
        required
      ></textarea>

      <button
        id="payButton"
        type="submit"
      >
        Continue to Payment
      </button>

    </form>

    <div
      id="message"
      class="message"
    ></div>

    <a
      id="trackLink"
      class="track-link"
      href="track-order.html"
      style="display:none;"
    >
      Track Your Order
    </a>

    <a
      href="index.html"
      class="back"
    >
      ← Back to Marketplace
    </a>

  </div>

</div>
