to<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout - Edesvino</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #111827;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1000px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #111827;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    nav a {
      color: #374151;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .checkout-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .message {
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 18px;
      display: none;
    }

    .error {
      background: #fef2f2;
      color: #991b1b;
    }

    .success {
      background: #ecfdf5;
      color: #065f46;
    }

    .product-list {
      margin-bottom: 24px;
    }

    .product-item {
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 0;
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .product-name {
      font-weight: bold;
    }

    .product-meta {
      color: #6b7280;
      font-size: 14px;
      margin-top: 5px;
    }

    .product-price {
      font-weight: bold;
      white-space: nowrap;
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      padding: 18px 0;
      border-top: 2px solid #111827;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 18px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #111827;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: #374151;
      text-decoration: none;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .checkout-card {
        padding: 18px;
      }

      .product-item {
        flex-direction: column;
      }

      .product-price {
        white-space: normal;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a class="logo" href="index.html">
      Edesvino
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#products-section">Shop</a>
      <a href="cart.html">Cart</a>
      <a href="track-order.html">Track Order</a>
    </nav>

  </div>
</header>

<main>

  <a class="back-link" href="index.html">
    ← Back to Marketplace
  </a>

  <div id="message" class="message"></div>

  <div id="checkoutContent" class="checkout-card">

    <div class="loading">
      <h2>Loading checkout...</h2>
      <p>Please wait.</p>
    </div>

  </div>

</main>

<footer>
  <strong>Edesvino Marketplace</strong><br>
  Buy. Sell. Grow.
</footer>


<script>

  /* ==================================================
     SUPABASE
  ================================================== */

  const SUPABASE_URL =
    "https://lxszilqypuglxyfyukdg.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==================================================
     STORAGE KEYS
  ================================================== */

  const CART_KEY =
    "edesvinoCart";

  const CHECKOUT_KEY =
    "edesvinoCheckout";


  /* ==================================================
     ELEMENTS
  ================================================== */

  const checkoutContent =
    document.getElementById(
      "checkoutContent"
    );

  const messageBox =
    document.getElementById(
      "message"
    );


  /* ==================================================
     STATE
  ================================================== */

  let checkoutItems = [];

  let singleProductId = null;

  let totalAmount = 0;

  let currentUser = null;

  let isCartCheckout = false;


  /* ==================================================
     MESSAGE
  ================================================== */

  function showMessage(
    text,
    type = "error"
  ) {

    messageBox.textContent =
      text;

    messageBox.className =
      "message " + type;

    messageBox.style.display =
      "block";
  }


  /* ==================================================
     HTML ESCAPE
  ================================================== */

  function escapeHTML(
    value
  ) {

    return String(
      value || ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  /* ==================================================
     MONEY
  ================================================== */

  function formatMoney(
    amount
  ) {

    return Number(
      amount || 0
    ).toLocaleString(
      "en-NG"
    );
  }


  /* ==================================================
     CART
  ================================================== */

  function getCart() {

    try {

      const cart =
        JSON.parse(
          localStorage.getItem(
            CART_KEY
          ) || "[]"
        );

      return Array.isArray(cart)
        ? cart
        : [];

    } catch (error) {

      console.error(
        "Unable to read cart:",
        error
      );

      return [];
    }
  }


  /* ==================================================
     AUTH
  ================================================== */

  async function checkAuth() {

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .getUser();


      if (
        error ||
        !data ||
        !data.user
      ) {

        sessionStorage.setItem(
          "edesvinoReturnToCheckout",
          window.location.href
        );

        window.location.href =
          "customer-login.html";

        return false;
      }


      currentUser =
        data.user;

      return true;

    } catch (error) {

      console.error(
        "Authentication error:",
        error
      );

      showMessage(
        "Unable to check your login. Please refresh the page."
      );

      return false;
    }
  }


  /* ==================================================
     LOAD CHECKOUT
     
     PRIORITY:
     
     1. product_id = BUY NOW
     2. cart = CART CHECKOUT
  ================================================== */

  async function loadCheckout() {

    try {

      const authenticated =
        await checkAuth();


      if (!authenticated) {
        return;
      }


      const params =
        new URLSearchParams(
          window.location.search
        );


      const productId =
  params.get("product_id") ||
  params.get("product") ||
  params.get("id");


      /*
        BUY NOW

        Product-details.html sends:

        checkout.html?product_id=9

        This MUST take priority over
        the cart.
      */

      if (productId) {

        isCartCheckout =
          false;

        const {
          data,
          error
        } =
          await supabaseClient

            .from("products")

            .select(`
              id,
              name,
              price,
              description,
              store,
              image_url,
              seller_id
            `)

            .eq(
              "id",
              productId
            )

            .maybeSingle();


        if (error) {

          console.error(
            "Product loading error:",
            error
          );

          throw new Error(
            "Unable to load product: " +
            error.message
          );
        }


        if (!data) {

          showMessage(
            "Product unavailable."
          );

          checkoutContent.innerHTML = `
            <div class="loading">

              <h2>Product unavailable</h2>

              <p>
                This product could not be found.
              </p>

            </div>
          `;

          return;
        }


        singleProductId =
          data.id;


        checkoutItems = [{

          id:
            data.id,

          name:
            data.name,

          price:
            Number(
              data.price || 0
            ),

          quantity:
            1,

          store:
            data.store ||
            "Eddy Digital Hub",

          seller_id:
            data.seller_id ||
            null

        }];


        renderCheckout();

        return;
      }


      /*
        CART CHECKOUT

        Only used when there is
        no product_id.
      */

      const cart =
        getCart();


      if (
        cart.length > 0
      ) {

        isCartCheckout =
          true;

        checkoutItems = [];


        for (
          const item of cart
        ) {

          if (!item.id) {
            continue;
          }


          const {
            data,
            error
          } =
            await supabaseClient

              .from("products")

              .select(`
                id,
                name,
                price,
                description,
                store,
                image_url,
                seller_id
              `)

              .eq(
                "id",
                item.id
              )

              .maybeSingle();


          if (error) {

            console.error(
              "Cart product error:",
              error
            );

            throw new Error(
              "Unable to load product: " +
              error.message
            );
          }


          if (!data) {
            continue;
          }


          const quantity =
            Math.max(
              1,
              Number(
                item.quantity || 1
              )
            );


          checkoutItems.push({

            id:
              data.id,

            name:
              data.name,

            price:
              Number(
                data.price || 0
              ),

            quantity:
              quantity,

            store:
              data.store ||
              "Eddy Digital Hub",

            seller_id:
              data.seller_id ||
              item.seller_id ||
              null

          });
        }


        if (
          checkoutItems.length === 0
        ) {

          showMessage(
            "No valid products were found in your cart."
          );

          checkoutContent.innerHTML = `
            <div class="loading">

              <h2>No cart items</h2>

              <p>
                Please return to the marketplace.
              </p>

            </div>
          `;

          return;
        }


        renderCheckout();

        return;
      }


      /*
        NOTHING SELECTED
      */

      showMessage(
        "No product or cart items were found."
      );

      checkoutContent.innerHTML = `
        <div class="loading">

          <h2>No product selected</h2>

          <p>
            Please return to the marketplace
            and select a product.
          </p>

        </div>
      `;

    } catch (error) {

      console.error(
        "Checkout loading error:",
        error
      );

      showMessage(
        error.message ||
        "Unable to load checkout."
      );

      checkoutContent.innerHTML = `
        <div class="loading">

          <h2>Unable to load checkout</h2>

          <p>
            ${escapeHTML(
              error.message ||
              "Please try again."
            )}
          </p>

        </div>
      `;
    }
  }


  /* ==================================================
     RENDER CHECKOUT
  ================================================== */

  function renderCheckout() {

    totalAmount =
      checkoutItems.reduce(
        (
          sum,
          item
        ) =>
          sum +
          (
            Number(item.price) *
            Number(item.quantity)
          ),
        0
      );


    const productHTML =
      checkoutItems
        .map(
          item => `

            <div class="product-item">

              <div>

                <div class="product-name">
                  ${escapeHTML(
                    item.name
                  )}
                </div>

                <div class="product-meta">
                  Quantity:
                  ${item.quantity}
                </div>

                <div class="product-meta">
                  Store:
                  ${escapeHTML(
                    item.store ||
                    "Eddy Digital Hub"
                  )}
                </div>

              </div>


              <div class="product-price">
                ₦${formatMoney(
                  Number(item.price) *
                  Number(item.quantity)
                )}
              </div>

            </div>

          `
        )
        .join("");


    checkoutContent.innerHTML = `

      <h1>
        Checkout
      </h1>


      <div class="product-list">

        ${productHTML}

      </div>


      <div class="total">

        <span>
          Total
        </span>

        <span>
          ₦${formatMoney(
            totalAmount
          )}
        </span>

      </div>


      <form
        id="checkoutForm"
      >

        <label
          for="customerName"
        >
          Full Name
        </label>

        <input
          type="text"
          id="customerName"
          required
          placeholder="Enter your full name"
        >


        <label
          for="customerPhone"
        >
          Phone Number
        </label>

        <input
          type="tel"
          id="customerPhone"
          required
          placeholder="Enter your phone number"
        >


        <label
          for="deliveryAddress"
        >
          Delivery Address
        </label>

        <textarea
          id="deliveryAddress"
          required
          placeholder="Enter your delivery address"
        ></textarea>


        <button
          type="submit"
          id="payButton"
        >
          Proceed to Payment
        </button>

      </form>

    `;


    document
      .getElementById(
        "checkoutForm"
      )
      .addEventListener(
        "submit",
        handleCheckout
      );
  }


  /* ==================================================
     PAYMENT INITIALIZATION
  ================================================== */

  async function handleCheckout(
    event
  ) {

    event.preventDefault();


    const payButton =
      document.getElementById(
        "payButton"
      );


    const customerName =
      document
        .getElementById(
          "customerName"
        )
        .value
        .trim();


    const customerPhone =
      document
        .getElementById(
          "customerPhone"
        )
        .value
        .trim();


    const deliveryAddress =
      document
        .getElementById(
          "deliveryAddress"
        )
        .value
        .trim();


    if (
      !customerName ||
      !customerPhone ||
      !deliveryAddress
    ) {

      showMessage(
        "Please complete all delivery details."
      );

      return;
    }


    payButton.disabled =
      true;

    payButton.textContent =
      "Preparing payment...";


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .getUser();


      if (
        error ||
        !data ||
        !data.user
      ) {

        throw new Error(
          "Your login session has expired. Please log in again."
        );
      }


      currentUser =
        data.user;


      /*
        Save checkout information.

        No order is created here.
      */

      const checkoutData = {

        customer_id:
          currentUser.id,

        customer_name:
          customerName,

        customer_phone:
          customerPhone,

        delivery_address:
          deliveryAddress,

        items:
          checkoutItems,

        total_amount:
          totalAmount,

        product_id:
          singleProductId,

        isCartCheckout:
          isCartCheckout

      };


      sessionStorage.setItem(
        CHECKOUT_KEY,
        JSON.stringify(
          checkoutData
        )
      );


      /*
        Prepare exact product information.
      */

      const metadataItems =
        checkoutItems.map(
          item => ({

            id:
              item.id,

            name:
              item.name,

            price:
              Number(item.price),

            quantity:
              Number(item.quantity),

            seller_id:
              item.seller_id ||
              null

          })
        );


      /*
        Existing smart-task
        payment initialization.
      */

      const functionUrl =
        SUPABASE_URL +
        "/functions/v1/smart-task";


      const response =
        await fetch(
          functionUrl,
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY

            },

            body:
              JSON.stringify({

                action:
                  "initialize_payment",

                customer_id:
                  currentUser.id,

                customer_name:
                  customerName,

                customer_phone:
                  customerPhone,

                delivery_address:
                  deliveryAddress,

                amount:
                  totalAmount,

                product_id:
                  singleProductId,

                items:
                  metadataItems

              })

          }
        );


      const result =
        await response.json();


      if (!response.ok) {

        throw new Error(
          result.error ||
          result.message ||
          "Unable to initialize payment."
        );
      }


      /*
        Accept the known
        Paystack authorization
        response formats.
      */

      const authorizationUrl =
        result.authorization_url ||
        result.data?.authorization_url ||
        result.url;


      if (
        authorizationUrl
      ) {

        window.location.href =
          authorizationUrl;

        return;
      }


      if (
        result.success
      ) {

        showMessage(
          result.message ||
          "Payment initialized successfully.",
          "success"
        );

        payButton.disabled =
          false;

        payButton.textContent =
          "Proceed to Payment";

        return;
      }


      throw new Error(
        result.error ||
        result.message ||
        "Payment initialization failed."
      );


    } catch (error) {

      console.error(
        "Payment initialization error:",
        error
      );


      showMessage(
        error.message ||
        "Unable to start payment."
      );


      payButton.disabled =
        false;

      payButton.textContent =
        "Proceed to Payment";
    }
  }


  /* ==================================================
     START
  ================================================== */

  loadCheckout();

</script>

</body>
</html>
