<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Checkout - Edesvino</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>

      font-family: Arial, sans-serif;
      background: #f5f7fa;

    header {

    header h1 {
      margin: 0;

    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    .product {
      background: #f9fafb;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .product-name {
      font-size: 20px;
      font-weight: bold;
    }

    .price {
      font-size: 22px;

    .store {

      color: #555;
    }

    label {
      display: block;
      margin-top: 15px;

    textarea {

      border-radius: 8px;

    button {

    }

    button:disabled {

    }

    .message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
      word-break: break-word;
    }

    .success {

    }

    .error {

    }

      text-decoration: none;
    }
  </style></head><body><header>
  <h1>Edesvino</h1>
</header><div class="container">  <div class="card"><h2>Checkout</h2>

<div id="productBox" class="product">
  Loading product...
</div>

<form id="checkoutForm">

  <label for="customerName">
    Full Name
  </label>

  <input
    type="text"
    id="customerName"
    required
  >

  <label for="customerPhone">
    Phone Number
  </label>

  <input
    type="tel"
    id="customerPhone"
    required
  >

  <label for="deliveryAddress">
    Delivery Address
  </label>

  <textarea
    id="deliveryAddress"
    required
  ></textarea>

  <button
    id="payButton"
    type="submit"
  >
    Continue to Payment
  </button>

</form>

<div
  id="message"
  class="message"
></div>

<a
  id="trackLink"
  class="track-link"
  href="track-order.html"
  style="display:none;"
>
  Track Your Order
</a>

<a
  href="index.html"
  class="back"
>
  ← Back to Marketplace
</a>

  </div></div><script>

/* =====================================================
   SUPABASE SETTINGS
===================================================== */

const SUPABASE_URL =
  "https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";


/* =====================================================
   EDGE FUNCTIONS
===================================================== */

const EDGE_FUNCTION_URL =
  SUPABASE_URL + "/functions/v1/smart-task";

const VERIFY_FUNCTION_URL =
  SUPABASE_URL + "/functions/v1/quick-function";


/* =====================================================
   SUPABASE CLIENT
===================================================== */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   PAGE ELEMENTS
===================================================== */

const productBox =
  document.getElementById("productBox");

const checkoutForm =
  document.getElementById("checkoutForm");

const payButton =
  document.getElementById("payButton");

const message =
  document.getElementById("message");

const trackLink =
  document.getElementById("trackLink");

let currentProduct = null;


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;

  message.style.display = "block";
}


/* =====================================================
   LOAD PRODUCT
===================================================== */

async function loadProduct() {

  try {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const productName =
      params.get("product");

    if (!productName) {

      productBox.innerHTML =
        "No product selected.";

      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .eq("name", productName)
        .limit(1)
        .maybeSingle();

    if (error) {
      throw error;
    }

    if (!data) {

      productBox.innerHTML =
        "Product not found.";

      return;
    }

    currentProduct = data;

    productBox.innerHTML = `

      <div class="product-name">
        ${data.name || "Product"}
      </div>

      <div>
        ${data.description || ""}
      </div>

      <div class="price">
        ₦${Number(
          data.price || 0
        ).toLocaleString()}
      </div>

      <div class="store">
        Store:
        ${
          data.store_name ||
          data.seller_name ||
          "Edesvino"
        }
      </div>

    `;

  } catch (error) {

    console.error(error);

    productBox.innerHTML =
      "Unable to load product.";
  }
}


/* =====================================================
   CREATE ORDER
===================================================== */

async function createOrder(paymentResult) {

  const checkoutData =
    JSON.parse(
      sessionStorage.getItem(
        "edesvinoCheckout"
      ) || "{}"
    );

  const paymentReference =
    paymentResult.reference;

  const idempotencyKey =
    "edesvinoPayment_" +
    paymentReference;

  const existingOrder =
    sessionStorage.getItem(
      idempotencyKey
    );

  if (existingOrder) {

    return {
      id: existingOrder
    };
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("orders")
      .insert([
        {
          product_name:
            checkoutData.product_name,

          price:
            checkoutData.price,

          customer_name:
            checkoutData.customer_name,

          customer_phone:
            checkoutData.customer_phone,

          delivery_address:
            checkoutData.delivery_address,

          seller_id:
            checkoutData.seller_id ||
            null,

          customer_id:
            checkoutData.customer_id ||
            null,

          status:
            "Pending"
        }
      ])
      .select()
      .single();

  if (error) {

    console.error(error);

    throw error;
  }

  sessionStorage.setItem(
    idempotencyKey,
    String(data.id)
  );

  return data;
}


/* =====================================================
   CONTINUE TO PAYMENT
===================================================== */

checkoutForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    if (!currentProduct) {

      showMessage(
        "Product information is not available.",
        "error"
      );

      return;
    }

    payButton.disabled = true;

    showMessage(
      "Preparing your payment...",
      "loading"
    );

    try {

      const {
        data: {
          user
        },
        error: userError
      } =
        await supabaseClient
          .auth
          .getUser();

      if (userError || !user) {

        throw new Error(
          "Please login before placing an order."
        );
      }

      const customerName =
        document
          .getElementById("customerName")
          .value
          .trim();

      const customerPhone =
        document
          .getElementById("customerPhone")
          .value
          .trim();

      const deliveryAddress =
        document
          .getElementById("deliveryAddress")
          .value
          .trim();

      if (
        !customerName ||
        !customerPhone ||
        !deliveryAddress
      ) {

        throw new Error(
          "Please complete all customer details."
        );
      }

      const checkoutData = {

        product_name:
          currentProduct.name,

        price:
          Number(
            currentProduct.price
          ),

        seller_id:
          currentProduct.seller_id ||
          null,

        customer_id:
          user.id,

        customer_name:
          customerName,

        customer_phone:
          customerPhone,

        delivery_address:
          deliveryAddress
      };

      sessionStorage.setItem(
        "edesvinoCheckout",
        JSON.stringify(
          checkoutData
        )
      );

      const callbackUrl =
        window.location.origin +
        window.location.pathname +
        window.location.search;

      /* =================================================
         INITIALIZE PAYSTACK PAYMENT
      ================================================= */

      const response =
        await fetch(
          EDGE_FUNCTION_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY
            },

            body:
              JSON.stringify({

                action:
                  "initialize",

                email:
                  user.email,

                
              amount:
               Number(
             currentProduct.price
            ), 
                       
        
                

                callback_url:
                  callbackUrl,

                metadata: {

                  product_name:
                    currentProduct.name,

                  seller_id:
                    currentProduct.seller_id ||
                    null,

                  customer_id:
                    user.id,

                  customer_name:
                    customerName,

                  customer_phone:
                    customerPhone
                }
              })
          }
        );

      const result =
        await response.json();

      console.log(
        "Paystack initialization:",
        result
      );

      if (
        !response.ok
      ) {

        throw new Error(
          result?.message ||
          "Unable to initialize Paystack payment."
        );
      }

      /*
       * SMART-TASK MAY RETURN THE URL
       * UNDER DIFFERENT PROPERTY NAMES.
       */

      const authorizationUrl =
        result?.authorization_url ||
        result?.data?.authorization_url ||
        result?.data?.data?.authorization_url ||
        result?.authorizationUrl ||
        result?.data?.authorizationUrl;

      if (!authorizationUrl) {

        throw new Error(
          result?.message ||
          "Paystack authorization URL was not returned."
        );
      }

      showMessage(
        "Opening Paystack payment...",
        "loading"
      );

      /*
       * IMPORTANT:
       * Use the actual Paystack authorization URL.
       */

      window.location.assign(
        authorizationUrl
      );

    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Payment initialization failed.",
        "error"
      );

      payButton.disabled = false;
    }

  }
);


/* =====================================================
   VERIFY PAYSTACK PAYMENT
===================================================== */

async function verifyPayment() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const reference =
    params.get("reference") ||
    params.get("trxref");

  if (!reference) {
    return;
  }

  showMessage(
    "Verifying your payment with Paystack...",
    "loading"
  );

  try {

    const response =
      await fetch(
        VERIFY_FUNCTION_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          },

          body:
            JSON.stringify({
              reference:
                reference
            })
        }
      );

    const result =
      await response.json();

    console.log(
      "Paystack verification:",
      result
    );

    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Payment verification failed."
      );
    }

    if (!result.paid) {

      throw new Error(
        "Payment was not successful."
      );
    }

    const paymentResult = {

      reference:
        result.reference ||
        reference,

      amount:
        result.amount ||
        0,

      status:
        result.status

    };

    const order =
      await createOrder(
        paymentResult
      );

    checkoutForm.style.display =
      "none";

    showMessage(
      "Payment was successfully verified by Paystack. " +
      "Your order has been created. " +
      "Order #" +
      order.id +
      " — ₦" +
      Number(
        paymentResult.amount / 100
      ).toLocaleString(),
      "success"
    );

    trackLink.style.display =
      "block";

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

  } catch (error) {

    console.error(error);

    showMessage(
      error.message ||
      "Payment verification failed.",
      "error"
    );

    payButton.disabled = false;
  }
}


/* =====================================================
   START PAGE
===================================================== */

loadProduct();

verifyPayment();

</script></body>
</html>
