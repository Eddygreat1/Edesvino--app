
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edesvino - Admin Products</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 6px;
      color: #0b7a45;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    .back {
      display: inline-block;
      margin: 0 0 20px;
      padding: 11px 15px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .product-card {
      background: white;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
      overflow-wrap: anywhere;
    }

    .product-card h2 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #0b7a45;
    }

    .product-card p {
      line-height: 1.5;
      margin: 8px 0;
    }

    .details-link {
      display: inline-block;
      margin-top: 10px;
      padding: 11px 15px;
      background: #0b7a45;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .details-link:active {
      opacity: 0.8;
    }

    #message {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin: 16px 0;
      overflow-wrap: anywhere;
    }

    .error {
      color: #b00020;
    }

    .empty {
      color: #666;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Edesvino</h1>
    <h2>Platform Admin - Products</h2>

    <p class="subtitle">
      View marketplace products and their details.
    </p>

    <a class="back" href="admin.html">
      ← Back to Admin Dashboard
    </a>

    <div id="message">Checking administrator access...</div>
    <div id="products"></div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://lxszilqypuglxyfyukdg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const message = document.getElementById("message");
    const productsContainer = document.getElementById("products");

    function showError(text) {
      message.className = "error";
      message.textContent = text;
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function (char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    function formatPrice(value) {
      const amount = Number(value);

      if (!Number.isFinite(amount)) {
        return escapeHTML(value);
      }

      return "₦" + amount.toLocaleString("en-NG");
    }

    async function loadProducts() {
      try {
        // Check the current Supabase login.
        const {
          data: { user },
          error: authError
        } = await supabaseClient.auth.getUser();

        if (authError) {
          throw authError;
        }

        if (!user) {
          window.location.replace("login.html");
          return;
        }

        // Confirm that this user is a platform administrator.
        const { data: admin, error: adminError } =
          await supabaseClient
            .from("platform_admins")
            .select("user_id")
            .eq("user_id", user.id)
            .maybeSingle();

        if (adminError) {
          throw adminError;
        }

        if (!admin) {
          showError("Access denied. Administrator access is required.");
          return;
        }

        // Load products, newest product ID first.
        const { data: products, error: productsError } =
          await supabaseClient
            .from("products")
            .select("*")
            .order("id", { ascending: false });

        if (productsError) {
          throw productsError;
        }

        if (!products || products.length === 0) {
          message.className = "empty";
          message.textContent = "No products found.";
          return;
        }

        message.className = "";
        message.textContent =
          "Showing " + products.length + " of " +
          products.length + " products.";

        productsContainer.innerHTML = products.map(function (product) {
          const productId = product.id;
          const hasId =
            productId !== null &&
            productId !== undefined &&
            String(productId).trim() !== "";

          const name = product.name || product.product_name || "Unnamed Product";
          const price = product.price;
          const description = product.description || "No description available.";

          const seller =
            product.store_name ||
            product.seller_name ||
            product.business_name ||
            "Edesvino Seller";

          const detailsLink = hasId
            ? '<a class="details-link" href="admin-product-details.html?product=' +
              encodeURIComponent(String(productId)) +
              '">View Details →</a>'
            : "";

          return `
            <section class="product-card">
              <h2>${escapeHTML(name)}</h2>

              <p>
                <strong>Price:</strong>
                ${formatPrice(price)}
              </p>

              <p>
                <strong>Description:</strong>
                ${escapeHTML(description)}
              </p>

              <p>
                <strong>Seller:</strong>
                ${escapeHTML(seller)}
              </p>

              <p>
                <strong>Product ID:</strong>
                ${hasId ? escapeHTML(productId) : "N/A"}
              </p>

              ${detailsLink}
            </section>
          `;
        }).join("");

      } catch (error) {
        console.error("Admin products error:", error);

        showError(
          "Unable to load products. Please check your connection " +
          "and administrator access, then reload the page."
        );
      }
    }

    loadProducts();
  </script>
</body>
</html>
