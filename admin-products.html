<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platform Admin - Products</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    .status {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .error {
      background: #ffe5e5;
      color: #b00020;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .summary {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .product {
      background: white;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .product h2 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .product p {
      margin: 7px 0;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
    }

    .seller {
      color: #555;
    }

    .back {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
