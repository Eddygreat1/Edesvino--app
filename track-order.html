<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edesvino - Track Your Order</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: 30px auto;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

.order {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 18px;
  margin-bottom: 15px;
}

.order h2 {
  margin-top: 0;
}

.order p {
  margin: 8px 0;
}

.status {
  font-weight: bold;
}

.loading,
.empty,
.error {
  text-align: center;
  padding: 20px;
}

.links {
  text-align: center;
  margin-top: 20px;
}

.links a {
  display: inline-block;
  margin: 5px;
  padding: 10px 15px;
  background: #111827;
  color: white;
  border-radius: 8px;
  text-decoration: none;
}

.login-btn {
  display: inline-block;
  padding: 12px 20px;
  background: #2563eb;
  color: white;
  border-radius: 8px;
  text-decoration: none;
  margin-top: 10px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Edesvino</h1>

<p class="subtitle">
Track Your Order
</p>

<div id="ordersContainer">

<div class="loading">
Checking your account...
</div>

</div>

<div class="links">

<a href="customer-dashboard.html">
Customer Dashboard
</a>

<a href="index.html">
Continue Shopping
</a>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
auth: {
persistSession: true,
autoRefreshToken: true,
detectSessionInUrl: true
}
}
);


async function loadOrders() {

const container =
document.getElementById("ordersContainer");


/*
Get the current session first.
*/

const {
data: sessionData,
error: sessionError
} =
await supabaseClient.auth.getSession();


if (
sessionError ||
!sessionData ||
!sessionData.session
) {

container.innerHTML = `

<div class="error">

You are not currently logged in.

<br><br>

<a class="login-btn"
href="customer-login.html">
Customer Login
</a>

</div>

`;

return;

}


const user =
sessionData.session.user;


/*
Get orders belonging to this customer.
*/

let {
data: orders,
error
} =
await supabaseClient
.from("orders")
.select("*")
.eq("customer_id", user.id)
.order("created_at", {
ascending: false
});


/*
Fallback using customer name.
*/

if (
!error &&
(!orders || orders.length === 0)
) {

const customerName =
user.user_metadata?.full_name ||
user.user_metadata?.name ||
"Endurance Edirin Jackson";


const fallbackResult =
await supabaseClient
.from("orders")
.select("*")
.eq("customer_name", customerName)
.order("created_at", {
ascending: false
});


if (
!fallbackResult.error &&
fallbackResult.data
) {

orders =
fallbackResult.data;

}

}


if (error) {

console.error(error);

container.innerHTML = `

<div class="error">

Unable to load your orders.

<br><br>

${escapeHtml(error.message)}

</div>

`;

return;

}


if (!orders || orders.length === 0) {

container.innerHTML = `

<div class="empty">

You don't have any orders yet.

</div>

`;

return;

}


container.innerHTML = "";


orders.forEach(function(order) {

const orderDate =
order.created_at
? new Date(order.created_at).toLocaleString()
: "Not available";


const orderBox =
document.createElement("div");

orderBox.className = "order";


orderBox.innerHTML = `

<h2>
Order #${escapeHtml(order.id)}
</h2>

<p>
<strong>Product:</strong>
${escapeHtml(order.product_name || "Product")}
</p>

<p>
<strong>Amount:</strong>
₦${Number(order.price || 0).toLocaleString()}
</p>

<p>
<strong>Customer:</strong>
${escapeHtml(order.customer_name || "")}
</p>

<p>
<strong>Order Date:</strong>
${escapeHtml(orderDate)}
</p>

<p>
<strong>Order Status:</strong>

<span class="status">
${escapeHtml(order.status || "Pending")}
</span>

</p>

`;

container.appendChild(orderBox);

});

}


/*
HTML safety
*/

function escapeHtml(value) {

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/*
Start
*/

loadOrders();

</script>

</body>
</html>
