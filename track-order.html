<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Order - Edesvino</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
    }

    .status {
      font-weight: bold;
      font-size: 18px;
    }

    .back {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      color: #111;
      font-weight: bold;
    }

    .message {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>Edesvino</h1>
  <p>Track Your Order</p>
</header>

<div class="container">

  <div id="orders">
    <div class="message">Loading your orders...</div>
  </div>

  <a class="back" href="index.html">← Back to Edesvino</a>

</div>

<script>
  const SUPABASE_URL = "https://lxszilqypuglxyfyukdg.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  async function loadOrders() {
    const ordersContainer = document.getElementById("orders");

    try {
      const {
        data: { user },
        error: userError
      } = await supabaseClient.auth.getUser();

      if (userError || !user) {
        ordersContainer.innerHTML = `
          <div class="message">
            <p>Please log in to track your orders.</p>
            <a href="customer-login.html">Customer Login</a>
          </div>
        `;
        return;
      }

      const { data: orders, error } = await supabaseClient
        .from("orders")
        .select("*")
        .eq("customer_email", user.email)
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);
        ordersContainer.innerHTML = `
          <div class="message">
            <p>Unable to load your orders.</p>
            <p>${error.message}</p>
          </div>
        `;
        return;
      }

      if (!orders || orders.length === 0) {
        ordersContainer.innerHTML = `
          <div class="message">
            <p>No orders found.</p>
          </div>
        `;
        return;
      }

      ordersContainer.innerHTML = "";

      orders.forEach(order => {
        const product =
          order.product_name ||
          order.product ||
          "Product";

        const amount =
          order.price ??
          order.amount ??
          0;

        const customer =
          order.customer_name ||
          order.customer ||
          "Customer";

        const status =
          order.status ||
          "Pending";

        const orderDate =
          order.created_at
            ? new Date(order.created_at).toLocaleString()
            : "N/A";

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <h2>Order #${order.id}</h2>

          <p><strong>Product:</strong><br>
          ${product}</p>

          <p><strong>Amount:</strong><br>
          ₦${Number(amount).toLocaleString()}</p>

          <p><strong>Customer:</strong><br>
          ${customer}</p>

          <p><strong>Order Date:</strong><br>
          ${orderDate}</p>

          <p class="status">
            <strong>Order Status:</strong><br>
            ${status}
          </p>
        `;

        ordersContainer.appendChild(card);
      });

    } catch (error) {
      console.error(error);

      ordersContainer.innerHTML = `
        <div class="message">
          <p>An unexpected error occurred.</p>
        </div>
      `;
    }
  }

  loadOrders();
</script>

</body>
</html>
