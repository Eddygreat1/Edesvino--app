<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product Details - Edesvino</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #111827;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #111827;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    nav a {
      color: #374151;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      color: #111827;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: #374151;
      text-decoration: none;
      font-size: 14px;
    }

    .product-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .product-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }

    .image-box {
      width: 100%;
      min-height: 330px;
      background: #f3f4f6;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .image-box img {
      width: 100%;
      height: 330px;
      object-fit: contain;
      display: block;
      background: #ffffff;
    }

    .no-image {
      color: #6b7280;
      font-size: 15px;
    }

    .product-info h1 {
      margin: 0 0 10px;
      font-size: 30px;
      color: #111827;
    }

    .description {
      color: #4b5563;
      line-height: 1.6;
      margin: 16px 0;
      white-space: pre-wrap;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin: 18px 0;
      color: #111827;
    }

    .store {
      display: inline-block;
      background: #f3f4f6;
      padding: 10px 14px;
      border-radius: 8px;
      color: #374151;
      margin-bottom: 22px;
      font-size: 14px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      padding: 15px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      border: none;
    }

    .cart-btn {
      background: #e5e7eb;
      color: #111827;
    }

    .buy-btn {
      background: #111827;
      color: #ffffff;
    }

    .cart-message {
      display: none;
      margin-top: 14px;
      padding: 12px;
      background: #ecfdf5;
      color: #065f46;
      border-radius: 8px;
      font-size: 14px;
    }

    .cart-message a {
      color: #065f46;
      font-weight: bold;
      margin-left: 5px;
    }

    .status {
      text-align: center;
      padding: 40px 20px;
      background: #ffffff;
      border-radius: 14px;
    }

    .status h2 {
      margin-top: 0;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      nav {
        gap: 10px;
      }

      .product-layout {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .image-box,
      .image-box img {
        height: 280px;
        min-height: 280px;
      }

      .product-info h1 {
        font-size: 25px;
      }

      .price {
        font-size: 25px;
      }

      .button-group {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">Edesvino</a>

    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#products-section">Shop</a>
      <a href="register.html">Sell</a>
      <a href="track-order.html">Track Order</a>
    </nav>
  </div>
</header>

<main>

  <a class="back-link" href="index.html">
    ← Back to Marketplace
  </a>

  <div id="content">
    <div class="status">
      <h2>Loading product...</h2>
      <p>Please wait.</p>
    </div>
  </div>

</main>

<footer>
  <strong>Edesvino Marketplace</strong><br>
  Buy. Sell. Grow.
</footer>

<script>
  const SUPABASE_URL =
    "https://lxszilqypuglxyfyukdg.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

  const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const CART_KEY = "edesvinoCart";

  const content = document.getElementById("content");

  async function loadProduct() {
    try {
      const params = new URLSearchParams(window.location.search);

      const productId = params.get("id");
      const productName = params.get("product");

      if (!productId && !productName) {
        showUnavailable("No product was selected.");
        return;
      }

      let query = supabaseClient
        .from("products")
        .select(`
          id,
          name,
          price,
          description,
          store,
          image_url
        `);

      if (productId) {
        query = query.eq("id", productId);
      } else {
        query = query.eq("name", productName);
      }

      const { data, error } = await query.maybeSingle();

      if (error) {
        console.error(error);
        showUnavailable("Unable to load this product.");
        return;
      }

      if (!data) {
        showUnavailable("Product unavailable.");
        return;
      }

      const storeName =
        data.store === "Edesvino"
          ? "Eddy Digital Hub"
          : (
              data.store ||
              data.store_name ||
              data.seller_name ||
              "Eddy Digital Hub"
            );

      const imageHTML = data.image_url
        ? `
          <img
            src="${escapeAttribute(data.image_url)}"
            alt="${escapeAttribute(data.name || "Product")}"
            onerror="this.style.display='none';"
          >
        `
        : `
          <div class="no-image">
            No image available
          </div>
        `;

      const description =
        data.description ||
        "No description available for this product.";

      const price = Number(data.price || 0);

      content.innerHTML = `
        <div class="product-card">

          <div class="product-layout">

            <div class="image-box">
              ${imageHTML}
            </div>

            <div class="product-info">

              <h1>${escapeHTML(data.name || "Product")}</h1>

              <div class="price">
                ₦${price.toLocaleString()}
              </div>

              <div class="store">
                Store: ${escapeHTML(storeName)}
              </div>

              <div class="description">
                ${escapeHTML(description)}
              </div>

              <div class="button-group">

                <button
                  class="btn cart-btn"
                  onclick='addToCart(${JSON.stringify({
                    id: data.id,
                    name: data.name,
                    price: price,
                    store: storeName,
                    image_url: data.image_url || ""
                  })})'
                >
                  🛒 Add to Cart
                </button>

                <a
                  class="btn buy-btn"
                  href="checkout.html?product=${encodeURIComponent(data.name)}"
                >
                  Buy Now
                </a>

              </div>

              <div id="cartMessage" class="cart-message">
                Added to your cart.
                <a href="cart.html">View Cart</a>
              </div>

            </div>

          </div>

        </div>
      `;

    } catch (error) {
      console.error(error);
      showUnavailable("Something went wrong while loading the product.");
    }
  }

  function addToCart(product) {
    try {
      let cart = JSON.parse(
        localStorage.getItem(CART_KEY) || "[]"
      );

      const existingIndex = cart.findIndex(
        item => String(item.id) === String(product.id)
      );

      if (existingIndex >= 0) {
        cart[existingIndex].quantity =
          Number(cart[existingIndex].quantity || 1) + 1;
      } else {
        cart.push({
          ...product,
          quantity: 1
        });
      }

      localStorage.setItem(
        CART_KEY,
        JSON.stringify(cart)
      );

      const message =
        document.getElementById("cartMessage");

      if (message) {
        message.style.display = "block";
      }

    } catch (error) {
      console.error("Unable to add product to cart:", error);
      alert("Unable to add this product to your cart.");
    }
  }

  function showUnavailable(message) {
    content.innerHTML = `
      <div class="status">
        <h2>Product unavailable</h2>
        <p>${escapeHTML(message)}</p>
        <br>
        <a class="back-link" href="index.html">
          ← Back to Marketplace
        </a>
      </div>
    `;
  }

  function escapeHTML(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function escapeAttribute(value) {
    return escapeHTML(value);
  }

  loadProduct();
</script>

</body>
</html>
