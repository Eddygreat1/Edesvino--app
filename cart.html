<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shopping Cart - Edesvino</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #111827;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #111827;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    nav a {
      color: #374151;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      color: #111827;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .cart-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .cart-item {
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 0;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .item-layout {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .item-image {
      width: 90px;
      height: 90px;
      border-radius: 10px;
      background: #f3f4f6;
      object-fit: contain;
      flex-shrink: 0;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .item-store {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .item-price {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .quantity-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .quantity-btn {
      width: 34px;
      height: 34px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
    }

    .quantity {
      min-width: 25px;
      text-align: center;
      font-weight: bold;
    }

    .remove-btn {
      border: none;
      background: transparent;
      color: #b91c1c;
      cursor: pointer;
      font-size: 14px;
      padding: 5px;
    }

    .item-total {
      font-weight: bold;
      font-size: 16px;
      white-space: nowrap;
    }

    .summary {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid #e5e7eb;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 10px 0;
    }

    .summary-total {
      font-size: 20px;
      font-weight: bold;
      margin-top: 14px;
    }

    .checkout-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      background: #111827;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .continue-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      background: #e5e7eb;
      color: #111827;
      text-align: center;
      text-decoration: none;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
    }

    .empty-cart {
      text-align: center;
      padding: 30px 10px;
    }

    .empty-cart h2 {
      margin-top: 0;
    }

    .empty-cart p {
      color: #6b7280;
    }

    .status-message {
      text-align: center;
      padding: 30px 10px;
      color: #6b7280;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .item-layout {
        align-items: flex-start;
      }

      .item-image {
        width: 75px;
        height: 75px;
      }

      .item-total {
        margin-left: 91px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a class="logo" href="index.html">
      Edesvino
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#products-section">Shop</a>
      <a id="cartNav" href="cart.html">Cart</a>
      <a href="register.html">Sell</a>
      <a href="track-order.html">Track Order</a>
    </nav>

  </div>
</header>

<main>

  <div class="cart-card">

    <h1>Shopping Cart</h1>

    <div id="cartContent">
      <div class="status-message">
        Loading cart...
      </div>
    </div>

  </div>

</main>

<footer>
  <strong>Edesvino Marketplace</strong><br>
  Buy. Sell. Grow.
</footer>

<script>
  const CART_KEY = "edesvinoCart";

  const cartContent =
    document.getElementById("cartContent");

  const cartNav =
    document.getElementById("cartNav");

  function getCart() {
    try {
      return JSON.parse(
        localStorage.getItem(CART_KEY) || "[]"
      );
    } catch (error) {
      console.error(error);
      return [];
    }
  }

  function saveCart(cart) {
    localStorage.setItem(
      CART_KEY,
      JSON.stringify(cart)
    );
  }

  function updateCartCounter() {
    const cart = getCart();

    const totalQuantity = cart.reduce(
      (total, item) =>
        total + Math.max(1, Number(item.quantity || 1)),
      0
    );

    cartNav.textContent =
      totalQuantity > 0
        ? "Cart (" + totalQuantity + ")"
        : "Cart";
  }

  function formatPrice(price) {
    return "₦" + Number(price || 0).toLocaleString();
  }

  function escapeHTML(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function renderCart() {
    const cart = getCart();

    updateCartCounter();

    if (!cart.length) {
      cartContent.innerHTML = `
        <div class="empty-cart">
          <h2>Your cart is empty</h2>

          <p>
            Add products to your cart and they will
            appear here.
          </p>

          <a
            class="continue-btn"
            href="index.html#products-section"
          >
            Continue Shopping
          </a>
        </div>
      `;

      return;
    }

    let subtotal = 0;

    let itemsHTML = "";

    cart.forEach((item, index) => {

      const price =
        Number(item.price || 0);

      const quantity =
        Math.max(
          1,
          Number(item.quantity || 1)
        );

      const itemTotal =
        price * quantity;

      subtotal += itemTotal;

      const imageHTML =
        item.image_url
          ? `
            <img
              class="item-image"
              src="${escapeHTML(item.image_url)}"
              alt="${escapeHTML(
                item.name || "Product"
              )}"
              onerror="this.style.display='none';"
            >
          `
          : `
            <div class="item-image"></div>
          `;

      itemsHTML += `
        <div class="cart-item">

          <div class="item-layout">

            ${imageHTML}

            <div class="item-info">

              <div class="item-name">
                ${escapeHTML(
                  item.name || "Product"
                )}
              </div>

              <div class="item-store">
                Store:
                ${escapeHTML(
                  item.store || "Eddy Digital Hub"
                )}
              </div>

              <div class="item-price">
                ${formatPrice(price)}
              </div>

              <div class="quantity-row">

                <button
                  class="quantity-btn"
                  onclick="changeQuantity(${index}, -1)"
                >
                  −
                </button>

                <span class="quantity">
                  ${quantity}
                </span>

                <button
                  class="quantity-btn"
                  onclick="changeQuantity(${index}, 1)"
                >
                  +
                </button>

                <button
                  class="remove-btn"
                  onclick="removeItem(${index})"
                >
                  Remove
                </button>

              </div>

            </div>

            <div class="item-total">
              ${formatPrice(itemTotal)}
            </div>

          </div>

        </div>
      `;
    });

    cartContent.innerHTML = `
      ${itemsHTML}

      <div class="summary">

        <div class="summary-row">
          <span>Subtotal</span>
          <strong>
            ${formatPrice(subtotal)}
          </strong>
        </div>

        <div class="summary-row">
          <span>Delivery</span>
          <span>
            Calculated at checkout
          </span>
        </div>

        <div class="summary-row summary-total">
          <span>Total</span>
          <span>
            ${formatPrice(subtotal)}
          </span>
        </div>

        <button
          class="checkout-btn"
          onclick="proceedToCheckout()"
        >
          Proceed to Checkout
        </button>

        <a
          class="continue-btn"
          href="index.html#products-section"
        >
          Continue Shopping
        </a>

      </div>
    `;
  }

  function changeQuantity(index, amount) {

    const cart = getCart();

    if (!cart[index]) {
      return;
    }

    const currentQuantity =
      Number(
        cart[index].quantity || 1
      );

    const newQuantity =
      currentQuantity + amount;

    if (newQuantity <= 0) {

      cart.splice(index, 1);

    } else {

      cart[index].quantity =
        newQuantity;

    }

    saveCart(cart);

    renderCart();
  }

  function removeItem(index) {

    const cart = getCart();

    if (!cart[index]) {
      return;
    }

    cart.splice(index, 1);

    saveCart(cart);

    renderCart();
  }

  function proceedToCheckout() {

    const cart = getCart();

    if (!cart.length) {

      alert("Your cart is empty.");

      return;
    }

    /*
      The current checkout page accepts a product name
      through the product query parameter.

      We keep the existing checkout connection unchanged.
    */

    const firstItem = cart[0];

    if (!firstItem.name) {

      alert(
        "Unable to continue with this product."
      );

      return;
    }

    window.location.href =
      "checkout.html?product=" +
      encodeURIComponent(
        firstItem.name
      );
  }

  renderCart();
</script>

</body>
</html>
