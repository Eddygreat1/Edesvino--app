<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shopping Cart - Edesvino</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #111827;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #111827;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    nav a {
      color: #374151;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 16px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    .cart-box {
      background: #ffffff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .cart-item {
      display: grid;
      grid-template-columns: 100px 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 18px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .item-image {
      width: 100px;
      height: 100px;
      border-radius: 10px;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .item-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #ffffff;
    }

    .no-image {
      color: #6b7280;
      font-size: 12px;
      text-align: center;
      padding: 8px;
    }

    .item-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .item-store {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .item-price {
      font-size: 17px;
      font-weight: bold;
    }

    .quantity-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .quantity-btn {
      width: 32px;
      height: 32px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
    }

    .quantity {
      min-width: 30px;
      text-align: center;
      font-weight: bold;
    }

    .remove-btn {
      border: none;
      background: transparent;
      color: #dc2626;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }

    .item-total {
      font-size: 17px;
      font-weight: bold;
      text-align: right;
      white-space: nowrap;
    }

    .summary {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 2px solid #e5e7eb;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 12px;
      font-size: 16px;
    }

    .summary-total {
      font-size: 22px;
      font-weight: bold;
      margin-top: 14px;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .continue {
      background: #e5e7eb;
      color: #111827;
    }

    .checkout {
      background: #111827;
      color: #ffffff;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
    }

    .empty h2 {
      margin-bottom: 10px;
    }

    .empty p {
      color: #6b7280;
      margin-bottom: 25px;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .cart-item {
        grid-template-columns: 80px 1fr;
      }

      .item-image {
        width: 80px;
        height: 80px;
      }

      .item-total {
        grid-column: 2;
        text-align: left;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">Edesvino</a>

    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#products-section">Shop</a>
      <a href="register.html">Sell</a>
      <a href="track-order.html">Track Order</a>
    </nav>
  </div>
</header>

<main>

  <h1>Shopping Cart</h1>

  <div id="cartContent"></div>

</main>

<footer>
  <strong>Edesvino Marketplace</strong><br>
  Buy. Sell. Grow.
</footer>

<script>
  const CART_KEY = "edesvinoCart";

  function getCart() {
    try {
      const saved = localStorage.getItem(CART_KEY);
      return saved ? JSON.parse(saved) : [];
    } catch (error) {
      console.error("Unable to read cart:", error);
      return [];
    }
  }

  function saveCart(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  }

  function money(value) {
    return "₦" + Number(value || 0).toLocaleString();
  }

  function escapeHTML(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function renderCart() {
    const cartContent = document.getElementById("cartContent");
    const cart = getCart();

    if (!cart.length) {
      cartContent.innerHTML = `
        <div class="cart-box">
          <div class="empty">
            <h2>Your cart is empty</h2>
            <p>Add products to your cart and they will appear here.</p>

            <a
              class="btn checkout"
              href="index.html#products-section"
              style="display:inline-block; max-width:260px;"
            >
              Continue Shopping
            </a>
          </div>
        </div>
      `;

      return;
    }

    let subtotal = 0;

    const itemsHTML = cart.map((item, index) => {
      const price = Number(item.price || 0);
      const quantity = Math.max(1, Number(item.quantity || 1));
      const total = price * quantity;

      subtotal += total;

      const imageHTML = item.image_url
        ? `
          <img
            src="${escapeHTML(item.image_url)}"
            alt="${escapeHTML(item.name)}"
            onerror="this.style.display='none';"
          >
        `
        : `
          <div class="no-image">
            No image
          </div>
        `;

      const storeName =
        item.store === "Edesvino"
          ? "Eddy Digital Hub"
          : (item.store || "Edesvino Seller");

      return `
        <div class="cart-item">

          <div class="item-image">
            ${imageHTML}
          </div>

          <div>

            <div class="item-name">
              ${escapeHTML(item.name)}
            </div>

            <div class="item-store">
              Store: ${escapeHTML(storeName)}
            </div>

            <div class="item-price">
              ${money(price)}
            </div>

            <div class="quantity-row">

              <button
                class="quantity-btn"
                onclick="changeQuantity(${index}, -1)"
              >
                −
              </button>

              <span class="quantity">
                ${quantity}
              </span>

              <button
                class="quantity-btn"
                onclick="changeQuantity(${index}, 1)"
              >
                +
              </button>

            </div>

            <button
              class="remove-btn"
              onclick="removeItem(${index})"
            >
              Remove
            </button>

          </div>

          <div class="item-total">
            ${money(total)}
          </div>

        </div>
      `;
    }).join("");

    cartContent.innerHTML = `
      <div class="cart-box">

        ${itemsHTML}

        <div class="summary">

          <div class="summary-row">
            <span>Subtotal</span>
            <strong>${money(subtotal)}</strong>
          </div>

          <div class="summary-row">
            <span>Delivery</span>
            <span>Calculated at checkout</span>
          </div>

          <div class="summary-row summary-total">
            <span>Total</span>
            <span>${money(subtotal)}</span>
          </div>

          <div class="actions">

            <a
              class="btn continue"
              href="index.html#products-section"
            >
              Continue Shopping
            </a>

            <button
              class="btn checkout"
              onclick="proceedToCheckout()"
            >
              Proceed to Checkout
            </button>

          </div>

        </div>

      </div>
    `;
  }

  function changeQuantity(index, amount) {
    const cart = getCart();

    if (!cart[index]) {
      return;
    }

    cart[index].quantity =
      Math.max(1, Number(cart[index].quantity || 1) + amount);

    saveCart(cart);
    renderCart();
  }

  function removeItem(index) {
    const cart = getCart();

    if (!cart[index]) {
      return;
    }

    cart.splice(index, 1);

    saveCart(cart);
    renderCart();
  }

  function proceedToCheckout() {
    const cart = getCart();

    if (!cart.length) {
      return;
    }

    /*
      For this first cart version, checkout remains
      connected to the existing product-based checkout flow.

      We send the first cart item's product name.
      Multi-product checkout will be connected in a
      later controlled step.
    */

    const firstProduct = cart[0];

    window.location.href =
      "checkout.html?product=" +
      encodeURIComponent(firstProduct.name);
  }

  renderCart();
</script>

</body>
</html>
