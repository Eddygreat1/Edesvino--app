
  <!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edesvino - My Products</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
}

.header {
  background: #111827;
  color: white;
  padding: 25px;
  border-radius: 12px;
  text-align: center;
}

.card {
  background: white;
  margin-top: 15px;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.product {
  border-bottom: 1px solid #ddd;
  padding: 15px 0;
}

.product:last-child {
  border-bottom: none;
}

.price {
  font-size: 20px;
  font-weight: bold;
  margin: 8px 0;
}

.message {
  text-align: center;
  padding: 20px;
}

.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #111827;
  font-weight: bold;
  text-decoration: none;
}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>Edesvino</h1>

    <p>My Products</p>

  </div>


  <div class="card">

    <div id="message"
         class="message">

      Loading your products...

    </div>

    <div id="products"></div>

  </div>


  <a
    class="back"
    href="dashboard.html">

    ← Back to Seller Dashboard

  </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function loadProducts() {

  const message =
  document.getElementById("message");

  const productsDiv =
  document.getElementById("products");


  const {
    data: userData,
    error: userError
  } =
  await supabaseClient.auth.getUser();


  if (userError || !userData.user) {

    window.location.replace("login.html");

    return;

  }


  const user =
  userData.user;


  const {
    data: products,
    error
  } =
  await supabaseClient
    .from("products")
    .select("*")
    .eq("seller_id", user.id)
    .order(
      "created_at",
      { ascending: false }
    );


  if (error) {

    message.textContent =
    "Unable to load products: " +
    error.message;

    return;

  }


  message.style.display =
  "none";


  if (!products || products.length === 0) {

    message.style.display =
    "block";

    message.textContent =
    "You have not added any products yet.";

    return;

  }


  products.forEach(function(product) {

    const item =
    document.createElement("div");

    item.className =
    "product";


    item.innerHTML = `

      <h2>
        ${product.name}
      </h2>

      <div class="price">
        ₦${Number(product.price).toLocaleString()}
      </div>

      <p>
        ${product.description || ""}
      </p>

      <p>
        <strong>Store:</strong>
        ${product.store || ""}
      </p>

    `;


    productsDiv.appendChild(item);

  });

}


loadProducts();

</script>

</body>
</html>
