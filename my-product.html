<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Products - Edesvino</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
}

.header {
  background: #111827;
  color: white;
  padding: 25px;
  text-align: center;
  border-radius: 12px;
}

.card {
  background: white;
  padding: 20px;
  margin-top: 15px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.product {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 15px;
}

.product h2 {
  margin-top: 0;
  margin-bottom: 8px;
}

.price {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 8px;
}

.store {
  font-weight: bold;
  margin-top: 10px;
}

.loading {
  text-align: center;
  padding: 20px;
}

.error {
  background: #fef2f2;
  border: 1px solid #ef4444;
  color: #991b1b;
  padding: 15px;
  border-radius: 8px;
  text-align: center;
}

button,
a {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  background: #111827;
  color: white;
  text-align: center;
  text-decoration: none;
  font-size: 16px;
  box-sizing: border-box;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Edesvino</h1>
    <p>My Products</p>
  </div>

  <div class="card">

    <div id="products">
      <div class="loading">
        Loading products...
      </div>
    </div>

    <a href="dashboard.html">
      ← Back to Seller Dashboard
    </a>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function loadProducts() {

  const productsContainer =
    document.getElementById("products");

  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .order("created_at", { ascending: false });


  if (error) {

    console.error(error);

    productsContainer.innerHTML = `
      <div class="error">
        Could not load products: ${error.message}
      </div>
    `;

    return;
  }


  if (!data || data.length === 0) {

    productsContainer.innerHTML = `
      <div class="loading">
        No products have been added yet.
      </div>
    `;

    return;
  }


  productsContainer.innerHTML = "";


  data.forEach(function(product) {

    const productDiv =
      document.createElement("div");

    productDiv.className = "product";

    productDiv.innerHTML = `
      <h2>${escapeHtml(product.name)}</h2>

      <div class="price">
        ₦${Number(product.price).toLocaleString()}
      </div>

      <div>
        ${escapeHtml(product.description || "")}
      </div>

      <div class="store">
        Store: ${escapeHtml(product.store || "")}
      </div>
    `;

    productsContainer.appendChild(productDiv);

  });

}


function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


loadProducts();

</script>

</body>
</html>
