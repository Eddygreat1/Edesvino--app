<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edesvino - Admin Orders</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
  color: #222;
}

.container {
  max-width: 1000px;
  margin: auto;
}

h1 {
  margin-bottom: 5px;
}

.subtitle {
  color: #666;
  margin-top: 0;
  margin-bottom: 20px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 10px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.order {
  border-top: 1px solid #eee;
  padding: 15px 0;
}

.order:first-child {
  border-top: none;
}

.label {
  font-weight: bold;
}

.status {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 6px;
  background: #eee;
  font-size: 13px;
  margin-top: 5px;
}

.loading,
.message {
  text-align: center;
  padding: 20px;
  color: #666;
}

.error {
  color: #b00020;
  background: #fff0f0;
  padding: 12px;
  border-radius: 8px;
}

.back {
  display: inline-block;
  margin-top: 15px;
  text-decoration: none;
  background: #222;
  color: white;
  padding: 10px 15px;
  border-radius: 7px;
}

@media (max-width: 600px) {
  body {
    padding: 12px;
  }

  .card {
    padding: 14px;
  }
}
</style></head><body><div class="container">  <h1>Platform Admin</h1>
  <p class="subtitle">All Marketplace Orders</p>  <div class="card">
    <div id="message" class="loading">Loading orders...</div>
    <div id="orders"></div>
  </div><a class="back" href="admin.html">← Back to Admin Dashboard</a>

</div><script>

const SUPABASE_URL =
  "https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


async function loadAdminOrders() {

  const message = document.getElementById("message");
  const ordersContainer = document.getElementById("orders");

  try {

    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError) {
      throw userError;
    }

    if (!user) {
      window.location.href = "login.html";
      return;
    }

    const {
      data: adminRecord,
      error: adminError
    } = await supabaseClient
      .from("platform_admins")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

    if (adminError) {
      throw adminError;
    }

    if (!adminRecord) {
      message.className = "error";
      message.textContent = "Access denied. Platform admin only.";
      return;
    }

    const {
      data: orders,
      error: ordersError
    } = await supabaseClient
      .from("orders")
      .select("*")
      .order("id", { ascending: false });

    if (ordersError) {
      throw ordersError;
    }

    message.style.display = "none";

    if (!orders || orders.length === 0) {
      ordersContainer.innerHTML =
        '<div class="message">No orders found.</div>';
      return;
    }

    ordersContainer.innerHTML = orders.map(order => {

      const amount =
        Number(order.total_amount ?? order.amount ?? order.price ?? 0);

      const createdAt =
        order.created_at
          ? new Date(order.created_at).toLocaleString()
          : "Not available";

      return `
        <div class="order">

          <div>
            <span class="label">Order #</span>
            ${order.id ?? "N/A"}
          </div>

          <div>
            <span class="label">Customer ID:</span>
            ${order.customer_id ?? "N/A"}
          </div>

          <div>
            <span class="label">Customer Name:</span>
            ${order.customer_name ?? "N/A"}
          </div>

          <div>
            <span class="label">Product:</span>
            ${order.product_name ?? "N/A"}
          </div>

          <div>
            <span class="label">Amount:</span>
            ₦${amount.toLocaleString()}
          </div>

          <div>
            <span class="label">Status:</span>
            <span class="status">
              ${order.status ?? "Pending"}
            </span>
          </div>

          <div>
            <span class="label">Date:</span>
            ${createdAt}
          </div>

          <div>
            <span class="label">Seller ID:</span>
            ${order.seller_id ?? "N/A"}
          </div>

        </div>
      `;

    }).join("");

  } catch (error) {

    console.error(error);

    message.className = "error";
    message.textContent =
      "Unable to load orders: " +
      (error.message || "Unknown error");

  }
}

loadAdminOrders();

</script></body>
</html>
