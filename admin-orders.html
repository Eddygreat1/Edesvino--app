<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edesvino - Admin Orders</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
  color: #222;
}

.container {
  max-width: 1000px;
  margin: auto;
}

.header {
  background: #111827;
  color: white;
  padding: 25px;
  border-radius: 12px;
  text-align: center;
  margin-bottom: 15px;
}

.header h1 {
  margin: 0 0 8px;
}

.header p {
  margin: 0;
  opacity: 0.9;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 10px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card h2 {
  margin-top: 0;
}

.controls {
  display: grid;
  gap: 10px;
  margin-bottom: 15px;
}

input,
select {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
}

.summary {
  font-weight: bold;
  margin-bottom: 15px;
}

.order {
  border-top: 1px solid #eee;
  padding: 18px 0;
}

.order:first-child {
  border-top: none;
}

.order div {
  margin-bottom: 8px;
  line-height: 1.4;
}

.order div:last-child {
  margin-bottom: 0;
}

.label {
  font-weight: bold;
}

.status {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 6px;
  background: #eee;
  font-size: 13px;
  margin-left: 4px;
}

.status-pending {
  background: #fff3cd;
  color: #856404;
}

.status-confirmed {
  background: #dbeafe;
  color: #1e40af;
}

.status-delivered {
  background: #d1fae5;
  color: #065f46;
}

.status-rejected {
  background: #fee2e2;
  color: #991b1b;
}

.loading,
.message {
  text-align: center;
  padding: 20px;
  color: #666;
}

.error {
  color: #b00020;
  background: #fff0f0;
  padding: 12px;
  border-radius: 8px;
}

.admin-navigation {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 15px;
}

.admin-link {
  display: block;
  text-align: center;
  padding: 13px 10px;
  background: #111827;
  color: white;
  font-weight: bold;
  text-decoration: none;
  border-radius: 8px;
}

.admin-link:hover {
  opacity: 0.9;
}

.back {
  display: block;
  text-align: center;
  margin-top: 15px;
  text-decoration: none;
  color: #111827;
  font-weight: bold;
}

.note {
  color: #666;
  font-size: 14px;
  line-height: 1.5;
}

@media (max-width: 600px) {

  body {
    padding: 12px;
  }

  .card {
    padding: 14px;
  }

  .admin-navigation {
    grid-template-columns: 1fr;
  }

}

</style>

</head>

<body>

<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1>Edesvino</h1>

    <p>Platform Admin — Orders</p>

  </div>


  <!-- ADMIN NAVIGATION -->

  <div class="admin-navigation">

    <a
      class="admin-link"
      href="admin.html">

      ← Control Center

    </a>


    <a
      class="admin-link"
      href="admin-products.html">

      📦 Products

    </a>


    <a
      class="admin-link"
      href="admin-withdrawals.html">

      💰 Withdrawals

    </a>


    <a
      class="admin-link"
      href="index.html">

      🛍️ Marketplace

    </a>

  </div>


  <!-- ORDERS -->

  <div class="card">

    <h2>All Marketplace Orders</h2>

    <p class="note">
      View and filter orders placed through
      the Edesvino marketplace.
    </p>


    <div class="controls">

      <input
        type="text"
        id="searchInput"
        placeholder="Search order number or product..."
      >


      <select id="statusFilter">

        <option value="All">
          All Orders
        </option>

        <option value="Pending">
          Pending
        </option>

        <option value="Confirmed">
          Confirmed
        </option>

        <option value="Delivered">
          Delivered
        </option>

        <option value="Rejected">
          Rejected
        </option>

      </select>

    </div>


    <div
      id="summary"
      class="summary">

      Loading orders...

    </div>


    <div id="message"></div>


    <div id="orders"></div>

  </div>


  <a
    class="back"
    href="admin.html">

    ← Back to Admin Control Center

  </a>


</div>


<script>

const SUPABASE_URL =
  "https://lxszilqypuglxyfyukdg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let allOrders = [];


function formatNaira(amount) {

  return "₦" +
    Number(amount || 0).toLocaleString(
      "en-NG"
    );

}


function getStatusClass(status) {

  const value =
    String(status || "Pending")
      .toLowerCase();

  if (value === "confirmed") {
    return "status-confirmed";
  }

  if (value === "delivered") {
    return "status-delivered";
  }

  if (value === "rejected") {
    return "status-rejected";
  }

  return "status-pending";

}


async function loadAdminOrders() {

  const message =
    document.getElementById(
      "message"
    );

  const summary =
    document.getElementById(
      "summary"
    );


  try {

    /*
      STEP 1
      Check that the user is logged in.
    */

    const {
      data: { user },
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (userError) {
      throw userError;
    }


    if (!user) {

      window.location.href =
        "login.html";

      return;

    }


    /*
      STEP 2
      Check platform admin access.
    */

    const {
      data: adminRecord,
      error: adminError
    } =
      await supabaseClient
        .from("platform_admins")
        .select("user_id")
        .eq(
          "user_id",
          user.id
        )
        .maybeSingle();


    if (adminError) {
      throw adminError;
    }


    if (!adminRecord) {

      message.className =
        "error";

      message.textContent =
        "Access denied. Platform admin only.";

      summary.textContent = "";

      return;

    }


    /*
      STEP 3
      Load all orders.
    */

    const {
      data: orders,
      error: ordersError
    } =
      await supabaseClient
        .from("orders")
        .select("*")
        .order(
          "id",
          {
            ascending: false
          }
        );


    if (ordersError) {
      throw ordersError;
    }


    allOrders =
      orders || [];


    renderOrders();


  } catch (error) {

    console.error(
      error
    );


    message.className =
      "error";


    message.textContent =
      "Unable to load orders: " +
      (
        error.message ||
        "Unknown error"
      );


    summary.textContent = "";

  }

}


function renderOrders() {

  const ordersContainer =
    document.getElementById(
      "orders"
    );


  const summary =
    document.getElementById(
      "summary"
    );


  const message =
    document.getElementById(
      "message"
    );


  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const selectedStatus =
    document
      .getElementById(
        "statusFilter"
      )
      .value;


  const filteredOrders =
    allOrders.filter(
      function(order) {


        const orderNumber =
          String(
            order.id ?? ""
          )
          .toLowerCase();


        const product =
          String(
            order.product_name ?? ""
          )
          .toLowerCase();


        const status =
          String(
            order.status ??
            "Pending"
          );


        const matchesSearch =
          orderNumber.includes(
            search
          ) ||
          product.includes(
            search
          );


        const matchesStatus =
          selectedStatus === "All" ||
          status === selectedStatus;


        return (
          matchesSearch &&
          matchesStatus
        );

      }
    );


  message.textContent = "";


  summary.textContent =
    `Showing ${filteredOrders.length} of ${allOrders.length} orders`;


  if (
    filteredOrders.length === 0
  ) {

    ordersContainer.innerHTML =
      '<div class="message">' +
      'No matching orders found.' +
      '</div>';

    return;

  }


  ordersContainer.innerHTML =
    filteredOrders
      .map(
        function(order) {


          const amount =
            Number(
              order.total_amount ??
              order.amount ??
              order.price ??
              0
            );


          const createdAt =
            order.created_at
              ? new Date(
                  order.created_at
                ).toLocaleString(
                  "en-NG"
                )
              : "Not available";


          const status =
            order.status ??
            "Pending";


          const statusClass =
            getStatusClass(
              status
            );


          return `

            <div class="order">

              <div>

                <span class="label">
                  Order #
                </span>

                ${order.id ?? "N/A"}

              </div>


              <div>

                <span class="label">
                  Customer ID:
                </span>

                ${order.customer_id ?? "N/A"}

              </div>


              <div>

                <span class="label">
                  Customer Name:
                </span>

                ${order.customer_name ?? "N/A"}

              </div>


              <div>

                <span class="label">
                  Product:
                </span>

                ${order.product_name ?? "N/A"}

              </div>


              <div>

                <span class="label">
                  Amount:
                </span>

                ${formatNaira(
                  amount
                )}

              </div>


              <div>

                <span class="label">
                  Status:
                </span>

                <span
                  class="status ${statusClass}">

                  ${status}

                </span>

              </div>


              <div>

                <span class="label">
                  Date:
                </span>

                ${createdAt}

              </div>


              <div>

                <span class="label">
                  Seller ID:
                </span>

                ${order.seller_id ?? "N/A"}

              </div>

            </div>

          `;

        }
      )
      .join("");

}


document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    renderOrders
  );


document
  .getElementById(
    "statusFilter"
  )
  .addEventListener(
    "change",
    renderOrders
  );


loadAdminOrders();

</script>

</body>

</html>
