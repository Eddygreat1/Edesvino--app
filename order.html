<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edesvino - Place Order</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
}

.header {
  background: #111827;
  color: white;
  padding: 25px;
  border-radius: 12px;
  text-align: center;
}

.card {
  background: white;
  padding: 20px;
  margin-top: 15px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.product {
  padding-bottom: 15px;
  border-bottom: 1px solid #ddd;
}

.price {
  font-size: 24px;
  font-weight: bold;
  margin-top: 10px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input,
textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

textarea {
  min-height: 110px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border: none;
  border-radius: 8px;
  background: #111827;
  color: white;
  font-size: 16px;
}

button:disabled {
  opacity: 0.6;
}

.message {
  margin-top: 20px;
  padding: 15px;
  border-radius: 8px;
  display: none;
}

.success {
  background: #ecfdf5;
  color: #065f46;
}

.error {
  background: #fef2f2;
  color: #991b1b;
}

.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #111827;
  font-weight: bold;
  text-decoration: none;
}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>Edesvino</h1>

    <p>Place Order</p>

  </div>


  <div class="card">

    <div id="productBox">

      Loading product...

    </div>


    <form id="orderForm" style="display:none;">

      <label for="customerName">
        Full Name
      </label>

      <input
        type="text"
        id="customerName"
        required
      >


      <label for="customerPhone">
        Phone Number
      </label>

      <input
        type="tel"
        id="customerPhone"
        required
      >


      <label for="deliveryAddress">
        Delivery Address
      </label>

      <textarea
        id="deliveryAddress"
        required
      ></textarea>


      <button
        type="submit"
        id="orderButton">

        Place Order

      </button>

    </form>


    <div
      id="message"
      class="message">
    </div>


    <a
      class="back"
      href="index.html">

      ← Back to Marketplace

    </a>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const productBox =
document.getElementById("productBox");

const orderForm =
document.getElementById("orderForm");

const orderButton =
document.getElementById("orderButton");

const message =
document.getElementById("message");


let currentProduct = null;


async function loadProduct() {

  const params =
  new URLSearchParams(
    window.location.search
  );

  const productName =
  params.get("product");


  if (!productName) {

    productBox.innerHTML =
    "<p>Product not found.</p>";

    return;

  }


  const result =
  await supabaseClient
    .from("products")
    .select("*")
    .eq("name", productName)
    .limit(1);


  if (result.error) {

    productBox.innerHTML =
    "<p>Unable to load product: " +
    result.error.message +
    "</p>";

    return;

  }


  if (!result.data ||
      result.data.length === 0) {

    productBox.innerHTML =
    "<p>Product not found.</p>";

    return;

  }


  currentProduct =
  result.data[0];


  productBox.innerHTML = `

    <div class="product">

      <h2>
        ${currentProduct.name}
      </h2>

      <p>
        ${currentProduct.description || ""}
      </p>

      <div class="price">
        ₦${Number(
          currentProduct.price
        ).toLocaleString()}
      </div>

      <p>
        <strong>Store:</strong>
        ${currentProduct.store || ""}
      </p>

    </div>

  `;


  orderForm.style.display =
  "block";

}


orderForm.addEventListener(
"submit",
async function(event) {

  event.preventDefault();


  if (!currentProduct) {

    return;

  }


  orderButton.disabled =
  true;

  orderButton.textContent =
  "Placing Order...";


  message.style.display =
  "block";

  message.className =
  "message";

  message.textContent =
  "Placing your order...";


  const customerName =
  document.getElementById(
    "customerName"
  ).value.trim();


  const customerPhone =
  document.getElementById(
    "customerPhone"
  ).value.trim();


  const deliveryAddress =
  document.getElementById(
    "deliveryAddress"
  ).value.trim();


  const orderData = {

    product_name:
    currentProduct.name,

    price:
    currentProduct.price,

    customer_name:
    customerName,

    customer_phone:
    customerPhone,

    delivery_address:
    deliveryAddress,

    seller_id:
    currentProduct.seller_id

  };


  const result =
  await supabaseClient
    .from("orders")
    .insert([orderData]);


  if (result.error) {

    message.className =
    "message error";

    message.textContent =
    "Order failed: " +
    result.error.message;

    orderButton.disabled =
    false;

    orderButton.textContent =
    "Place Order";

    return;

  }


  message.className =
  "message success";

  message.textContent =
  "Order placed successfully!";


  orderForm.reset();


  orderButton.disabled =
  false;

  orderButton.textContent =
  "Place Order";

});


loadProduct();

</script>

</body>
</html>
