<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Orders - Edesvino</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 700px;
      margin: 25px auto;
      padding: 15px;
    }

    .order {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .order h2 {
      margin-top: 0;
    }

    .status {
      font-weight: bold;
      margin: 15px 0 8px;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    .save-button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
    }

    .message {
      margin-top: 8px;
      font-weight: bold;
    }

    .back {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      color: #111;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>Edesvino</h1>
  <p>Customer Orders</p>
</header>

<main>

  <div id="orders">
    Loading orders...
  </div>

  <a class="back" href="dashboard.html">
    ← Back to Seller Dashboard
  </a>

</main>

<script>
  const SUPABASE_URL = "https://lxszilqypuglxyfyukdg.supabase.co";
  const SUPABASE_KEY = "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function loadOrders() {
    const ordersContainer = document.getElementById("orders");

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      window.location.replace("login.html");
      return;
    }

    const { data: orders, error } = await supabaseClient
      .from("orders")
      .select("*")
      .eq("seller_id", user.id)
      .order("created_at", { ascending: false });

    if (error) {
      console.error(error);
      ordersContainer.innerHTML =
        "<p>Unable to load orders.</p>";
      return;
    }

    if (!orders || orders.length === 0) {
      ordersContainer.innerHTML =
        "<p>No customer orders yet.</p>";
      return;
    }

    ordersContainer.innerHTML = orders.map(order => {

      const status = order.status || "Pending";

      return `
        <div class="order">

          <h2>${escapeHtml(order.product_name)}</h2>

          <p><strong>Amount:</strong>
            ₦${Number(order.price).toLocaleString()}
          </p>

          <p><strong>Customer:</strong>
            ${escapeHtml(order.customer_name)}
          </p>

          <p><strong>Phone:</strong>
            ${escapeHtml(order.customer_phone)}
          </p>

          <p><strong>Delivery Address:</strong>
            ${escapeHtml(order.delivery_address)}
          </p>

          <p><strong>Order Date:</strong>
            ${new Date(order.created_at).toLocaleString()}
          </p>

          <div class="status">
            Order Status
          </div>

          <select id="status-${order.id}">
            <option value="Pending" ${status === "Pending" ? "selected" : ""}>
              Pending
            </option>

            <option value="Confirmed" ${status === "Confirmed" ? "selected" : ""}>
              Confirmed
            </option>

            <option value="Shipped" ${status === "Shipped" ? "selected" : ""}>
              Shipped
            </option>

            <option value="Delivered" ${status === "Delivered" ? "selected" : ""}>
              Delivered
            </option>

            <option value="Cancelled" ${status === "Cancelled" ? "selected" : ""}>
              Cancelled
            </option>
          </select>

          <button
            class="save-button"
            onclick="updateStatus(${order.id})"
          >
            Save Status
          </button>

          <div
            class="message"
            id="message-${order.id}"
          ></div>

        </div>
      `;

    }).join("");
  }

  async function updateStatus(orderId) {

    const select =
      document.getElementById("status-" + orderId);

    const message =
      document.getElementById("message-" + orderId);

    const newStatus = select.value;

    const { data: { user } } =
      await supabaseClient.auth.getUser();

    if (!user) {
      window.location.replace("login.html");
      return;
    }

    const { error } = await supabaseClient
      .from("orders")
      .update({
        status: newStatus
      })
      .eq("id", orderId)
      .eq("seller_id", user.id);

    if (error) {
      console.error(error);

      message.textContent =
        "Unable to update status.";

      return;
    }

    message.textContent =
      "Status updated successfully!";

    loadOrders();
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  loadOrders();
</script>

</body>
</html>
