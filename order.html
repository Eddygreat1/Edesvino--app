
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Place Order - Edesvino</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
}

.header {
  background: #111827;
  color: white;
  padding: 25px;
  text-align: center;
  border-radius: 12px;
}

.card {
  background: white;
  padding: 20px;
  margin-top: 15px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.product-box {
  background: #f3f4f6;
  padding: 18px;
  border-radius: 10px;
  margin-bottom: 20px;
}

.product-box h2 {
  margin-top: 0;
}

.price {
  font-size: 24px;
  font-weight: bold;
  margin-top: 10px;
}

.store {
  margin-top: 10px;
  color: #555;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  box-sizing: border-box;
  font-size: 16px;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

button,
.back {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  border: none;
  border-radius: 8px;
  background: #111827;
  color: white;
  text-align: center;
  text-decoration: none;
  font-size: 16px;
  box-sizing: border-box;
  cursor: pointer;
}

.success {
  display: none;
  margin-top: 20px;
  padding: 15px;
  background: #ecfdf5;
  border: 1px solid #10b981;
  border-radius: 8px;
  color: #065f46;
  text-align: center;
}

.error {
  display: none;
  margin-top: 20px;
  padding: 15px;
  background: #fef2f2;
  border: 1px solid #ef4444;
  border-radius: 8px;
  color: #991b1b;
}

.loading {
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Edesvino</h1>
    <p>Place Your Order</p>
  </div>

  <div class="card">

    <div id="loading" class="loading">
      Loading product...
    </div>

    <div id="productBox" class="product-box" style="display:none;">

      <h2 id="productName"></h2>

      <p id="productDescription"></p>

      <div class="price">
        ₦<span id="productPrice">0</span>
      </div>

      <div class="store">
        Store: <strong id="productStore"></strong>
      </div>

    </div>

    <form id="orderForm" style="display:none;">

      <label for="customerName">
        Full Name
      </label>

      <input
        type="text"
        id="customerName"
        placeholder="Enter your full name"
        required
      >

      <label for="customerPhone">
        Phone Number
      </label>

      <input
        type="tel"
        id="customerPhone"
        placeholder="Enter your phone number"
        required
      >

      <label for="deliveryAddress">
        Delivery Address
      </label>

      <textarea
        id="deliveryAddress"
        placeholder="Enter your delivery address"
        required
      ></textarea>

      <button type="submit">
        Place Order
      </button>

    </form>

    <div id="successMessage" class="success">
      Order placed successfully!
    </div>

    <div id="errorMessage" class="error"></div>

    <a href="index.html" class="back">
      ← Back to Marketplace
    </a>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const params =
  new URLSearchParams(window.location.search);

const selectedProduct =
  params.get("product");


let currentProduct = null;


async function loadProduct() {

  const loading =
    document.getElementById("loading");

  const productBox =
    document.getElementById("productBox");

  const orderForm =
    document.getElementById("orderForm");

  const errorMessage =
    document.getElementById("errorMessage");


  if (!selectedProduct) {

    loading.style.display = "none";

    errorMessage.textContent =
      "No product was selected.";

    errorMessage.style.display =
      "block";

    return;
  }


  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .eq("name", selectedProduct)
      .limit(1)
      .maybeSingle();


  if (error) {

    console.error(error);

    loading.style.display = "none";

    errorMessage.textContent =
      "Unable to load product: " +
      error.message;

    errorMessage.style.display =
      "block";

    return;
  }


  if (!data) {

    loading.style.display = "none";

    errorMessage.textContent =
      "Product not found.";

    errorMessage.style.display =
      "block";

    return;
  }


  currentProduct = data;


  document.getElementById("productName")
    .textContent = data.name;

  document.getElementById("productDescription")
    .textContent =
      data.description || "No description available.";

  document.getElementById("productPrice")
    .textContent =
      Number(data.price).toLocaleString();

  document.getElementById("productStore")
    .textContent =
      data.store || "Edesvino Seller";


  loading.style.display = "none";

  productBox.style.display = "block";

  orderForm.style.display = "block";
}


loadProduct();


document
  .getElementById("orderForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();


    const successMessage =
      document.getElementById("successMessage");

    const errorMessage =
      document.getElementById("errorMessage");


    successMessage.style.display = "none";
    errorMessage.style.display = "none";


    if (!currentProduct) {

      errorMessage.textContent =
        "Product information is not available.";

      errorMessage.style.display =
        "block";

      return;
    }


    const customerName =
      document.getElementById("customerName")
        .value.trim();

    const customerPhone =
      document.getElementById("customerPhone")
        .value.trim();

    const deliveryAddress =
      document.getElementById("deliveryAddress")
        .value.trim();


    const { error } =
      await supabaseClient
        .from("orders")
        .insert([{

          product_name:
            currentProduct.name,

          price:
            Number(currentProduct.price),

          customer_name:
            customerName,

          customer_phone:
            customerPhone,

          delivery_address:
            deliveryAddress

        }]);


    if (error) {

      console.error(error);

      errorMessage.textContent =
        "Order could not be placed: " +
        error.message;

      errorMessage.style.display =
        "block";

      return;
    }


    document
      .getElementById("orderForm")
      .reset();


    successMessage.style.display =
      "block";

  });

</script>

</body>
</html>
