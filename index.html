<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Edesvino Marketplace</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
    }

    .header-content {
      max-width: 1000px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
      font-size: 14px;
    }

    .hero {
      background: white;
      text-align: center;
      padding: 45px 20px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    .hero p {
      color: #666;
      font-size: 17px;
      margin-bottom: 25px;
    }

    .hero-buttons a {
      display: inline-block;
      padding: 13px 20px;
      margin: 5px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }

    .shop-button {
      background: #111;
      color: white;
    }

    .sell-button {
      background: #e8e8e8;
      color: #111;
    }

    .products-section {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .products-section h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(220px, 1fr)
      );
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background: #eee;
    }

    .no-image {
      width: 100%;
      height: 220px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 14px;
    }

    .product-content {
      padding: 20px;
    }

    .product h3 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .description {
      color: #666;
      min-height: 40px;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
      margin: 15px 0 8px;
    }

    .store {
      color: #555;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .buy {
      display: block;
      text-align: center;
      background: #111;
      color: white;
      padding: 12px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }

    .buy:hover {
      opacity: 0.85;
    }

    .loading,
    .empty,
    .error {
      background: white;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
      grid-column: 1 / -1;
    }

    footer {
      margin-top: 40px;
      background: #111;
      color: white;
      text-align: center;
      padding: 25px 20px;
    }

    footer p {
      margin: 5px 0;
    }

    @media (max-width: 600px) {

      .header-content {
        flex-direction: column;
      }

      nav a {
        margin: 0 7px;
      }

      .hero h1 {
        font-size: 28px;
      }

      .product-image,
      .no-image {
        height: 200px;
      }

    }
  </style>
</head>

<body>

<header>

  <div class="header-content">

    <div class="logo">
      Edesvino
    </div>

    <nav>

      <a href="index.html">
        Home
      </a>

      <a href="#products-section">
        Shop
      </a>

      <a href="register.html">
        Sell
      </a>

      <a href="track-order.html">
        Track Order
      </a>

    </nav>

  </div>

</header>


<section class="hero">

  <h1>
    Buy. Sell. Grow.
  </h1>

  <p>
    Discover products from Edesvino sellers and shop online with ease.
  </p>

  <div class="hero-buttons">

    <a
      class="shop-button"
      href="#products-section"
    >
      Shop Products
    </a>

    <a
      class="sell-button"
      href="register.html"
    >
      Become a Seller
    </a>

  </div>

</section>


<section
  class="products-section"
  id="products-section"
>

  <h2>
    Featured Products
  </h2>

  <div id="products">

    <div class="loading">
      Loading products...
    </div>

  </div>

</section>


<footer>

  <p>
    <strong>Edesvino Marketplace</strong>
  </p>

  <p>
    Buy. Sell. Grow.
  </p>

</footer>


<script>

const SUPABASE_URL =
  "https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadProducts() {

  const productsContainer =
    document.getElementById("products");


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);

      productsContainer.innerHTML =
        `
        <div class="error">
          Unable to load products.
          <br>
          Please try again later.
        </div>
        `;

      return;
    }


    if (
      !data ||
      data.length === 0
    ) {

      productsContainer.innerHTML =
        `
        <div class="empty">
          No products available yet.
        </div>
        `;

      return;
    }


    productsContainer.innerHTML = "";


    data.forEach(product => {

      const productName =
        product.name ||
        "Unnamed Product";


      const description =
        product.description ||
        "No description available.";


      const store =
        product.store ||
        "Edesvino Seller";


      const price =
        Number(
          product.price || 0
        ).toLocaleString();


      const productLink =
        "checkout.html?product=" +
        encodeURIComponent(
          productName
        );


      const productDiv =
        document.createElement(
          "div"
        );


      productDiv.className =
        "product";


      let imageHTML = "";


      if (product.image_url) {

        imageHTML =
          `
          <img
            class="product-image"
            src="${product.image_url}"
            alt="${productName}"
            loading="lazy"
          >
          `;

      } else {

        imageHTML =
          `
          <div class="no-image">
            No image available
          </div>
          `;

      }


      productDiv.innerHTML =
        `
        ${imageHTML}

        <div class="product-content">

          <h3>
            ${productName}
          </h3>

          <p class="description">
            ${description}
          </p>

          <div class="price">
            ₦${price}
          </div>

          <div class="store">
            Store: ${store}
          </div>

          <a
            class="buy"
            href="${productLink}"
          >
            Buy Now
          </a>

        </div>
        `;


      productsContainer.appendChild(
        productDiv
      );

    });


  } catch (error) {

    console.error(error);

    productsContainer.innerHTML =
      `
      <div class="error">
        Something went wrong.
        <br>
        Please try again.
      </div>
      `;

  }

}


loadProducts();

</script>

</body>
</html>
