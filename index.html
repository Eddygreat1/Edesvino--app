<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edesvino Marketplace</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 800px;
  margin: auto;
}

.header {
  background: #111827;
  color: white;
  padding: 25px;
  text-align: center;
  border-radius: 12px;
}

.header h1 {
  margin: 0;
}

.nav {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.nav a {
  flex: 1;
  background: white;
  color: #111827;
  padding: 12px;
  text-align: center;
  text-decoration: none;
  border-radius: 8px;
  font-weight: bold;
}

.card {
  background: white;
  padding: 20px;
  margin-top: 15px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.product {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 15px;
  margin-top: 15px;
}

.product h2 {
  margin-top: 0;
}

.price {
  font-size: 20px;
  font-weight: bold;
  margin: 10px 0;
}

.store {
  margin-top: 10px;
  font-weight: bold;
}

.buy {
  display: block;
  background: #111827;
  color: white;
  padding: 13px;
  margin-top: 15px;
  text-align: center;
  text-decoration: none;
  border-radius: 8px;
}

.loading {
  text-align: center;
  padding: 20px;
}

.error {
  background: #fef2f2;
  border: 1px solid #ef4444;
  color: #991b1b;
  padding: 15px;
  border-radius: 8px;
}

.empty {
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Edesvino</h1>
    <p>Buy. Sell. Grow.</p>
  </div>

  <div class="nav">
    <a href="index.html">Home</a>
    <a href="#products">Shop</a>
    <a href="register.html">Sell</a>
  </div>

  <div class="card">
    <h2>Welcome to Edesvino</h2>
    <p>Buy and sell products online.</p>
  </div>

  <div class="card" id="products">

    <h2>Products</h2>

    <div id="productList">
      <div class="loading">
        Loading products...
      </div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function loadProducts() {

  const productList =
    document.getElementById("productList");

  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .order("created_at", { ascending: false });


  if (error) {

    console.error(error);

    productList.innerHTML = `
      <div class="error">
        Could not load products: ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  if (!data || data.length === 0) {

    productList.innerHTML = `
      <div class="empty">
        No products available yet.
      </div>
    `;

    return;
  }


  productList.innerHTML = "";


  data.forEach(function(product) {

    const productDiv =
      document.createElement("div");

    productDiv.className = "product";

    const productName =
      escapeHtml(product.name || "");

    const description =
      escapeHtml(product.description || "");

    const store =
      escapeHtml(product.store || "");

    const price =
      Number(product.price || 0).toLocaleString();


    productDiv.innerHTML = `
      <h2>${productName}</h2>

      <p>${description}</p>

      <div class="price">
        ₦${price}
      </div>

      <div class="store">
        Store: ${store}
      </div>

      <a class="buy"
         href="order.html?product=${encodeURIComponent(product.name || "")}">
        Buy Now
      </a>
    `;


    productList.appendChild(productDiv);

  });

}


function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


loadProducts();

</script>

</body>
</html>
