
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edesvino Marketplace</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:white;padding:18px 20px}
.header-content{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-size:24px;font-weight:bold}
nav a{color:white;text-decoration:none;margin-left:12px;font-size:14px}
.hero{background:white;text-align:center;padding:45px 20px}
.hero h1{margin:0 0 10px;font-size:34px}
.hero p{color:#666;font-size:17px;margin-bottom:25px}
.hero-buttons a{display:inline-block;padding:13px 20px;margin:5px;border-radius:7px;text-decoration:none;font-weight:bold}
.shop-button{background:#111;color:white}
.sell-button{background:#e8e8e8;color:#111}
.products-section{max-width:1000px;margin:30px auto;padding:0 20px}
.products-section h2{text-align:center;margin-bottom:20px}
.search-box{margin-bottom:25px}
.search-box input{width:100%;padding:14px 16px;border:1px solid #ccc;border-radius:8px;font-size:16px}
#products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.product{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #00000014}
.product-image,.no-image{width:100%;height:220px;object-fit:cover;display:block;background:#eee}
.no-image{display:flex;align-items:center;justify-content:center;color:#777;font-size:14px}
.product-content{padding:20px}
.product h3{margin-top:0;margin-bottom:10px}
.description{color:#666;min-height:40px}
.price{font-size:21px;font-weight:bold;margin:15px 0 8px}
.store{color:#555;font-size:14px;margin-bottom:15px}
.buy,.add-cart{display:block;width:100%;text-align:center;padding:12px;border-radius:7px;font-weight:bold;text-decoration:none;border:0;font-size:15px;cursor:pointer;margin-top:10px}
.buy{background:#111;color:white}
.add-cart{background:#087f45;color:white}
.buy:hover,.add-cart:hover{opacity:.85}
.loading,.empty,.error{background:white;padding:25px;border-radius:10px;text-align:center;grid-column:1/-1}
footer{margin-top:40px;background:#111;color:white;text-align:center;padding:25px 20px}
footer p{margin:5px 0}
@media(max-width:600px){.header-content{flex-direction:column}nav a{margin:0 5px;font-size:13px}.hero h1{font-size:28px}.product-image,.no-image{height:200px}}
</style>
</head>
<body>
<header>
<div class="header-content">
<div class="logo">Edesvino</div>
<nav>
<a href="index.html">Home</a>
<a href="#products-section">Shop</a>
<a href="cart.html">Cart</a>
<a href="register.html">Sell</a>
<a href="track-order.html">Track Order</a>
</nav>
</div>
</header>

<section class="hero">
<h1>Buy. Sell. Grow.</h1>
<p>Discover products from Edesvino sellers and shop online with ease.</p>
<div class="hero-buttons">
<a class="shop-button" href="#products-section">Shop Products</a>
<a class="sell-button" href="register.html">Become a Seller</a>
</div>
</section>

<section class="products-section" id="products-section">
<h2>Featured Products</h2>
<div class="search-box">
<input type="search" id="searchInput" placeholder="Search products..." autocomplete="off">
</div>
<div id="products"><div class="loading">Loading products...</div></div>
</section>

<footer>
<p><strong>Edesvino Marketplace</strong></p>
<p>Buy. Sell. Grow.</p>
</footer>

<script>
const SUPABASE_URL = "https://lxszilqypuglxyfyukdg.supabase.co";
const SUPABASE_KEY = "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const productsContainer = document.getElementById("products");
const searchInput = document.getElementById("searchInput");
const CART_KEY = "edesvinoCart";
let allProducts = [];

function naira(amount) {
  return "₦" + Number(amount || 0).toLocaleString("en-NG");
}

function addToCart(product) {
  try {
    const saved = localStorage.getItem(CART_KEY);
    const cart = saved ? JSON.parse(saved) : [];

    if (!Array.isArray(cart)) {
      throw new Error("Cart data is not a valid list.");
    }

    const existing = cart.find(
      item => String(item.id) === String(product.id)
    );

    if (existing) {
      existing.quantity = Number(existing.quantity || 1) + 1;
    } else {
      cart.push({
        id: product.id,
        name: product.name || "Unnamed Product",
        description: product.description || "",
        price: Number(product.price || 0),
        quantity: 1,
        seller_id: product.seller_id || null,
        store: product.store || "Edesvino Seller",
        image: product.image_url || "",
        image_url: product.image_url || ""
      });
    }

    localStorage.setItem(CART_KEY, JSON.stringify(cart));

    const button = document.querySelector(
      '[data-cart-product="' + String(product.id) + '"]'
    );

    if (button) {
      button.textContent = "✓ Added to Cart";
      setTimeout(() => {
        if (button.isConnected) button.textContent = "Add to Cart";
      }, 1500);
    }

    alert((product.name || "Product") + " added to your cart!");
  } catch (error) {
    console.error("Add to cart failed:", error);
    alert("Unable to add this product to your cart. Please try again.");
  }
}

function displayProducts(products) {
  if (!products || products.length === 0) {
    productsContainer.innerHTML =
      '<div class="empty">No products found.</div>';
    return;
  }

  productsContainer.innerHTML = "";

  products.forEach(product => {
    const card = document.createElement("div");
    card.className = "product";

    const link = "product-details.html?product_id=" +
      encodeURIComponent(product.id);
    

    const image = document.createElement("div");

    if (product.image_url && product.image_url.trim()) {
      const img = document.createElement("img");
      img.className = "product-image";
      img.src = product.image_url;
      img.alt = product.name || "Product";
      img.onerror = () => {
        const placeholder = document.createElement("div");
        placeholder.className = "no-image";
        placeholder.textContent = "Image unavailable";
        img.replaceWith(placeholder);
      };
      image.appendChild(img);
    } else {
      image.className = "no-image";
      image.textContent = "No image available";
    }

    const content = document.createElement("div");
    content.className = "product-content";

    const name = document.createElement("h3");
    name.textContent = product.name || "Unnamed Product";

    const description = document.createElement("p");
    description.className = "description";
    description.textContent = product.description || "No description available.";

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = naira(product.price);

    const store = document.createElement("div");
    store.className = "store";
    store.textContent = "Store: " + (product.store || "Edesvino Seller");

    const view = document.createElement("a");
    view.className = "buy";
    view.href = link;
    view.textContent = "View Product";

    const add = document.createElement("button");
    add.type = "button";
    add.className = "add-cart";
    add.dataset.cartProduct = String(product.id);
    add.textContent = "Add to Cart";
    add.addEventListener("click", () => addToCart(product));

    content.append(name, description, price, store, view, add);
    card.append(image, content);
    productsContainer.appendChild(card);
  });
}

async function loadProducts() {
  productsContainer.innerHTML =
    '<div class="loading">Loading products...</div>';

  try {
    const { data, error } = await supabaseClient
      .from("products")
      .select("id,name,price,description,store,image_url,seller_id,created_at")
      .order("created_at", { ascending: false });

    if (error) throw error;

    allProducts = data || [];
    displayProducts(allProducts);
  } catch (error) {
    console.error("Loading products failed:", error);
    productsContainer.innerHTML =
      '<div class="error">Unable to load products. Please try again later.</div>';
  }
}

searchInput.addEventListener("input", function() {
  const term = searchInput.value.trim().toLowerCase();

  displayProducts(allProducts.filter(product =>
    String(product.name || "").toLowerCase().includes(term) ||
    String(product.description || "").toLowerCase().includes(term) ||
    String(product.store || "").toLowerCase().includes(term)
  ));
});

loadProducts();
</script>
</body>
</html>
