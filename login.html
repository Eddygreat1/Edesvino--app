<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seller Login - Edesvino</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
}

.header {
  background: #111827;
  color: white;
  padding: 25px;
  text-align: center;
  border-radius: 12px;
}

.card {
  background: white;
  padding: 20px;
  margin-top: 15px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  box-sizing: border-box;
  font-size: 16px;
}

button,
.link-button {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  border: none;
  border-radius: 8px;
  background: #111827;
  color: white;
  text-align: center;
  text-decoration: none;
  font-size: 16px;
  box-sizing: border-box;
  cursor: pointer;
}

.success {
  display: none;
  margin-top: 20px;
  padding: 15px;
  background: #ecfdf5;
  border: 1px solid #10b981;
  border-radius: 8px;
  color: #065f46;
}

.error {
  display: none;
  margin-top: 20px;
  padding: 15px;
  background: #fef2f2;
  border: 1px solid #ef4444;
  border-radius: 8px;
  color: #991b1b;
}

.register {
  text-align: center;
  margin-top: 20px;
}

.register a {
  color: #111827;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Edesvino</h1>
    <p>Seller Login</p>
  </div>

  <div class="card">

    <form id="loginForm">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

    <div id="successMessage" class="success"></div>

    <div id="errorMessage" class="error"></div>

    <div class="register">
      Don't have a seller account?
      <a href="register.html">Create one</a>
    </div>

    <a href="index.html" class="link-button">
      ← Back to Marketplace
    </a>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


document
  .getElementById("loginForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("email")
        .value.trim();

    const password =
      document.getElementById("password")
        .value;


    const successMessage =
      document.getElementById("successMessage");

    const errorMessage =
      document.getElementById("errorMessage");


    successMessage.style.display = "none";
    errorMessage.style.display = "none";


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      console.error(error);

      errorMessage.textContent =
        error.message;

      errorMessage.style.display =
        "block";

      return;
    }


    if (data.user) {

      const sellerData = {

        fullName:
          data.user.user_metadata?.full_name || "",

        storeName:
          data.user.user_metadata?.store_name || "",

        email:
          data.user.email || "",

        phone:
          data.user.user_metadata?.phone || ""

      };
