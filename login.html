
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edesvino Seller Login</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
}

.header {
  background: #111827;
  color: white;
  padding: 25px;
  text-align: center;
  border-radius: 12px;
}

.card {
  background: white;
  padding: 20px;
  margin-top: 15px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border: none;
  border-radius: 8px;
  background: #111827;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

.message {
  display: none;
  margin-top: 20px;
  padding: 15px;
  border-radius: 8px;
}

.success {
  background: #ecfdf5;
  border: 1px solid #10b981;
  color: #065f46;
}

.error {
  background: #fef2f2;
  border: 1px solid #ef4444;
  color: #991b1b;
}

.link {
  display: block;
  text-align: center;
  margin-top: 20px;
}

a {
  color: #111827;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Edesvino</h1>
    <p>Seller Login</p>
  </div>

  <div class="card">

    <form id="loginForm">

      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button id="loginButton" type="submit">
        Login
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="link">
      Don't have a seller account?
      <a href="register.html">Create one</a>
    </div>

    <div class="link">
      <a href="index.html">← Back to Marketplace</a>
    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const form =
  document.getElementById("loginForm");

const button =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


form.addEventListener("submit", async function(event) {

  event.preventDefault();

  message.style.display = "block";
  message.className = "message";
  message.textContent = "Logging in...";

  button.disabled = true;
  button.textContent = "Logging in...";


  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  try {

    const result =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (result.error) {

      message.className =
        "message error";

      message.textContent =
        "Login failed: " + result.error.message;

      button.disabled = false;
      button.textContent = "Login";

      return;
    }


    if (result.data && result.data.user) {

      const user =
        result.data.user;

      const sellerData = {

        fullName:
          user.user_metadata?.full_name || "",

        storeName:
          user.user_metadata?.store_name || "",

        email:
          user.email || "",

        phone:
          user.user_metadata?.phone || ""

      };


      localStorage.setItem(
        "edesvinoSeller",
        JSON.stringify(sellerData)
      );


      message.className =
        "message success";

      message.textContent =
        "Login successful! Opening seller dashboard...";


      setTimeout(function() {

        window.location.href =
          "dashboard.html";

      }, 1000);

    }

  } catch (error) {

    message.className =
      "message error";

    message.textContent =
      "Error: " + error.message;

    button.disabled = false;
    button.textContent = "Login";

  }

});

</script>

</body>
</html>
