
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edesvino Seller Dashboard</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
}

.header {
  background: #111827;
  color: white;
  padding: 25px;
  border-radius: 12px;
  text-align: center;
}

.card {
  background: white;
  margin-top: 15px;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.button {
  display: block;
  text-decoration: none;
  background: #111827;
  color: white;
  padding: 15px;
  margin-top: 12px;
  border-radius: 8px;
  text-align: center;
}

.logout {
  background: #b91c1c;
  border: none;
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border-radius: 8px;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.message {
  text-align: center;
  padding: 20px;
  font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>Edesvino</h1>

    <p>Seller Dashboard</p>

  </div>


  <div id="loading" class="message">

    Checking seller login...

  </div>


  <div id="dashboard" style="display:none;">

    <div class="card">

      <h2>
        Welcome,
        <span id="sellerName"></span>!
      </h2>

      <p>
        <strong>Store:</strong>
        <span id="storeName"></span>
      </p>

      <p>
        <strong>Email:</strong>
        <span id="sellerEmail"></span>
      </p>

      <p>
        <strong>Phone:</strong>
        <span id="sellerPhone"></span>
      </p>

    </div>


    <div class="card">

      <h2>Seller Tools</h2>

      <a class="button"
         href="add-product.html">
        Add Product
      </a>

      <a class="button"
         href="my-product.html">
        My Products
      </a>

      <a class="button"
         href="orders.html">
        Orders
      </a>

      <a class="button"
         href="sales.html">
        Sales & Earnings
      </a>

    </div>


    <div class="card">

      <h2>Marketplace</h2>

      <a class="button"
         href="index.html">
        ← Back to Marketplace
      </a>

      <button
        class="logout"
        id="logoutButton">
        Logout
      </button>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function checkSellerLogin() {

  const result =
    await supabaseClient.auth.getSession();

  const session =
    result.data.session;


  if (!session) {

    window.location.replace("login.html");

    return;

  }


  const user =
    session.user;


  document.getElementById("sellerName")
    .textContent =
    user.user_metadata?.full_name || "Seller";


  document.getElementById("storeName")
    .textContent =
    user.user_metadata?.store_name ||
    "Edesvino Store";


  document.getElementById("sellerEmail")
    .textContent =
    user.email || "";


  document.getElementById("sellerPhone")
    .textContent =
    user.user_metadata?.phone || "";


  document.getElementById("loading")
    .style.display = "none";


  document.getElementById("dashboard")
    .style.display = "block";

}


document
.getElementById("logoutButton")
.addEventListener("click", async function() {

  this.disabled = true;

  this.textContent = "Logging out...";


  await supabaseClient.auth.signOut();


  window.location.replace("login.html");

});


checkSellerLogin();

</script>

</body>
</html>
