<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edesvino Seller Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 22px;
  text-align: center;
}

.container {
  width: 92%;
  max-width: 700px;
  margin: auto;
}

.card {
  background: white;
  margin-top: 20px;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

h1,
h2 {
  margin-top: 0;
}

.info {
  line-height: 1.8;
}

.menu {
  display: grid;
  gap: 12px;
}

.menu a,
.menu button {
  display: block;
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 8px;
  color: white;
  text-decoration: none;
  text-align: center;
  font-size: 16px;
  cursor: pointer;
}

.add {
  background: #16a34a;
}

.products {
  background: #2563eb;
}

.orders {
  background: #7c3aed;
}

.sales {
  background: #0891b2;
}

.marketplace {
  background: #111827;
}

.logout {
  background: #dc2626;
}

.message {
  margin-top: 20px;
  padding: 15px;
  background: #f3f4f6;
  border-radius: 8px;
}

footer {
  text-align: center;
  padding: 30px 10px;
}

footer a {
  color: #111827;
  text-decoration: none;
}
</style>
</head>

<body>

<header>

<h1>Edesvino Marketplace</h1>

<p>Seller Dashboard</p>

</header>


<div class="container">


<div class="card">

<h2>Welcome, Seller</h2>

<div id="sellerInfo">
Loading seller information...
</div>

</div>


<div class="card">

<h2>Seller Menu</h2>

<div class="menu">


<a
class="add"
href="add-product.html"
>
+ Add Product
</a>


<a
class="products"
href="my-product.html"
>
My Products
</a>


<a
class="orders"
href="orders.html"
>
Customer Orders
</a>


<a
class="sales"
href="sales.html"
>
Sales & Earnings
</a>


<a
class="marketplace"
href="index.html"
>
View Marketplace
</a>


<button
class="logout"
onclick="logout()"
>
Logout
</button>


</div>

</div>


<div class="card">

<h2>Store Information</h2>

<div id="storeInfo">
Loading...
</div>

</div>


<div
id="message"
class="message"
>
Seller dashboard is ready.
</div>


</div>


<footer>

<a href="index.html">
← Back to Marketplace
</a>

</footer>


<script>

const sellerData =
localStorage.getItem(
"edesvinoSeller"
);

const sellerInfo =
document.getElementById(
"sellerInfo"
);

const storeInfo =
document.getElementById(
"storeInfo"
);


if (!sellerData) {

sellerInfo.innerHTML = `

<p>
No seller information was found
on this device.
</p>

<p>
<a href="register.html">
Register as a Seller
</a>
</p>

`;

storeInfo.innerHTML =
"<p>No store information available.</p>";

} else {

try {

const seller =
JSON.parse(sellerData);


const name =
seller.name ||
seller.fullName ||
seller.sellerName ||
"Seller";


const store =
seller.store ||
seller.storeName ||
seller.businessName ||
"Edesvino Store";


const email =
seller.email ||
"Not provided";


const phone =
seller.phone ||
"Not provided";


sellerInfo.innerHTML = `

<p>
<strong>Name:</strong>
${escapeHtml(name)}
</p>

<p>
<strong>Email:</strong>
${escapeHtml(email)}
</p>

<p>
<strong>Phone:</strong>
${escapeHtml(phone)}
</p>

`;


storeInfo.innerHTML = `

<p>
<strong>Store Name:</strong>
${escapeHtml(store)}
</p>

<p>
<strong>Status:</strong>
Active
</p>

`;

}

catch (error) {

sellerInfo.innerHTML =
"<p>Unable to load seller information.</p>";

storeInfo.innerHTML =
"<p>Unable to load store information.</p>";

}

}


/*
LOGOUT
*/

function logout() {

localStorage.removeItem(
"edesvinoSeller"
);

window.location.href =
"index.html";

}


/*
SECURITY HELPER
*/

function escapeHtml(text) {

const div =
document.createElement(
"div"
);

div.textContent =
text;

return div.innerHTML;

}

</script>

</body>
</html>
