<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edesvino Seller Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 20px;
  text-align: center;
}

.container {
  width: 92%;
  max-width: 700px;
  margin: auto;
}

.card {
  background: white;
  margin-top: 20px;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

h1,
h2,
h3 {
  margin-top: 0;
}

.info {
  line-height: 1.7;
}

.menu {
  display: grid;
  gap: 12px;
  margin-top: 20px;
}

.menu button,
.menu a {
  display: block;
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 8px;
  background: #111827;
  color: white;
  text-decoration: none;
  text-align: center;
  font-size: 16px;
  cursor: pointer;
}

.menu a.add {
  background: #16a34a;
}

.menu a.shop {
  background: #2563eb;
}

.logout {
  background: #dc2626 !important;
}

.stat {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.stat:last-child {
  border-bottom: none;
}

.message {
  padding: 15px;
  border-radius: 8px;
  margin-top: 15px;
  background: #f3f4f6;
}

.warning {
  background: #fff7ed;
  color: #9a3412;
}

footer {
  text-align: center;
  padding: 30px 10px;
}

footer a {
  color: #111827;
  text-decoration: none;
}
</style>
</head>

<body>

<header>
  <h1>Edesvino Marketplace</h1>
  <p>Seller Dashboard</p>
</header>

<div class="container">

  <div class="card">

    <h2>Welcome, Seller</h2>

    <div id="sellerInfo" class="info">
      Loading seller information...
    </div>

  </div>


  <div class="card">

    <h2>Seller Menu</h2>

    <div class="menu">

      <a
        class="add"
        href="add-product.html"
      >
        + Add Product
      </a>

      <a
        href="products.html"
      >
        My Products
      </a>

      <a
        href="orders.html"
      >
        Orders
      </a>

      <a
        href="sales.html"
      >
        Sales
      </a>

      <a
        href="earnings.html"
      >
        Earnings
      </a>

      <a
        class="shop"
        href="index.html"
      >
        View Marketplace
      </a>

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </div>


  <div class="card">

    <h2>Account Status</h2>

    <div class="stat">
      <span>Seller Account</span>
      <strong id="accountStatus">
        Active
      </strong>
    </div>

    <div class="stat">
      <span>Store</span>
      <strong id="storeStatus">
        —
      </strong>
    </div>

  </div>


  <div
    id="message"
    class="message"
  >
    Your seller dashboard is ready.
  </div>

</div>


<footer>

  <a href="index.html">
    ← Back to Marketplace
  </a>

</footer>


<script>

const sellerData =
localStorage.getItem(
  "edesvinoSeller"
);


const sellerInfo =
document.getElementById(
  "sellerInfo"
);


const storeStatus =
document.getElementById(
  "storeStatus"
);


if (!sellerData) {

  sellerInfo.innerHTML = `

    <div class="warning">

      No seller information was found
      on this device.

      <br><br>

      Please register as a seller first.

      <br><br>

      <a href="register.html">
        Register Seller
      </a>

    </div>

  `;

} else {

  try {

    const seller =
    JSON.parse(sellerData);

    const name =
    seller.name ||
    seller.fullName ||
    seller.sellerName ||
    "Seller";

    const store =
    seller.store ||
    seller.storeName ||
    seller.businessName ||
    "Edesvino Store";

    const email =
    seller.email ||
    "Not provided";

    const phone =
    seller.phone ||
    "Not provided";

    sellerInfo.innerHTML = `

      <strong>Name:</strong>
      ${escapeHtml(name)}

      <br>

      <strong>Store:</strong>
      ${escapeHtml(store)}

      <br>

      <strong>Email:</strong>
      ${escapeHtml(email)}

      <br>

      <strong>Phone:</strong>
      ${escapeHtml(phone)}

    `;

    storeStatus.textContent =
    store;

  }

  catch (error) {

    sellerInfo.innerHTML = `

      <div class="warning">

        Seller information could not
        be loaded correctly.

      </div>

    `;

  }

}


/*
  LOGOUT
*/

function logout() {

  localStorage.removeItem(
    "edesvinoSeller"
  );

  window.location.href =
    "index.html";

}


/*
  SECURITY HELPER
*/

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}

</script>

</body>
</html>
