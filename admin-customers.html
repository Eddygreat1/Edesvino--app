<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edesvino - Admin Customers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
  color: #222;
}

.container {
  max-width: 950px;
  margin: auto;
}

.header {
  background: #111827;
  color: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.header h1 {
  margin: 0 0 5px;
  font-size: 24px;
}

.header p {
  margin: 0;
  color: #d1d5db;
}

.nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}

.nav a {
  display: inline-block;
  padding: 9px 12px;
  background: white;
  color: #111827;
  text-decoration: none;
  border-radius: 7px;
  font-size: 14px;
  font-weight: bold;
}

.nav a:hover {
  background: #e5e7eb;
}

.controls {
  background: white;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
}

.summary {
  margin-top: 10px;
  color: #555;
  font-size: 14px;
}

.customer {
  background: white;
  padding: 18px;
  margin-bottom: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.customer h2 {
  margin: 0 0 15px;
  font-size: 20px;
}

.customer p {
  margin: 9px 0;
  line-height: 1.45;
}

.customer-id {
  word-break: break-all;
  color: #555;
}

.view-details {
  display: inline-block;
  margin-top: 12px;
  padding: 10px 14px;
  background: #0066cc;
  color: white;
  text-decoration: none;
  border-radius: 7px;
  font-weight: bold;
}

.view-details:hover {
  background: #0052a3;
}

.message {
  background: white;
  padding: 20px;
  border-radius: 10px;
}

.error {
  background: #fff0f0;
  color: #b00020;
  padding: 15px;
  border-radius: 8px;
  margin-top: 10px;
}

.back {
  display: inline-block;
  margin-top: 20px;
  text-decoration: none;
  color: #0066cc;
  font-weight: bold;
}

@media (max-width: 600px) {

  body {
    padding: 12px;
  }

  .header {
    padding: 16px;
  }

  .header h1 {
    font-size: 21px;
  }

  .nav a {
    flex: 1 1 auto;
    text-align: center;
  }

  .customer {
    padding: 15px;
  }

}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>Edesvino</h1>

    <p>Platform Admin — Customers</p>

    <div class="nav">

      <a href="admin.html">
        ← Control Center
      </a>

      <a href="admin-products.html">
        📦 Products
      </a>

      <a href="admin-orders.html">
        📋 Orders
      </a>

      <a href="admin-withdrawals.html">
        💰 Withdrawals
      </a>

      <a href="index.html">
        🛍️ Marketplace
      </a>

    </div>

  </div>

  <div class="controls">

    <input
      type="text"
      id="searchInput"
      placeholder="Search customer name or customer ID..."
    >

    <div class="summary" id="summary">
      Starting...
    </div>

  </div>

  <div id="customers">
    Connecting to Supabase...
  </div>

  <a class="back" href="admin.html">
    ← Back to Admin Control Center
  </a>

</div>

<script>

const SUPABASE_URL =
"https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let customers = [];

function getOrderAmount(order) {

  return Number(
    order.total_amount ??
    order.amount ??
    order.price ??
    0
  );

}

function formatNaira(amount) {

  return "₦" +
    Number(amount || 0)
      .toLocaleString();

}

async function loadCustomers() {

  const box =
    document.getElementById("customers");

  const summary =
    document.getElementById("summary");

  try {

    box.textContent =
      "Checking admin login...";

    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError) {

      throw new Error(
        "Login check failed: " +
        userError.message
      );

    }

    if (!user) {

      box.innerHTML =
        '<div class="message">' +
        'Please log in as an admin.' +
        '</div>';

      summary.textContent = "";

      return;

    }

    box.textContent =
      "Checking admin permission...";

    const {
      data: admin,
      error: adminError
    } = await supabaseClient
      .from("platform_admins")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

    if (adminError) {

      throw new Error(
        "Admin check failed: " +
        adminError.message
      );

    }

    if (!admin) {

      box.innerHTML =
        '<div class="message">' +
        'Access denied. Admin account required.' +
        '</div>';

      summary.textContent = "";

      return;

    }

    box.textContent =
      "Loading marketplace orders...";

    const {
      data: orders,
      error: ordersError
    } = await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at", {
        ascending: false
      });

    if (ordersError) {

      throw new Error(
        "Orders request failed: " +
        ordersError.message
      );

    }

    const customerMap = {};

    (orders || []).forEach(order => {

      const customerId =
        order.customer_id ||
        "unknown-" +
        (order.customer_name || "unknown");

      if (!customerMap[customerId]) {

        customerMap[customerId] = {

          customer_id:
            order.customer_id || "N/A",

          customer_name:
            order.customer_name || "N/A",

          order_count: 0,

          total_spent: 0,

          last_order:
            order.created_at || null

        };

      }

      customerMap[customerId].order_count += 1;

      customerMap[customerId].total_spent +=
        getOrderAmount(order);

      if (
        order.created_at &&
        (
          !customerMap[customerId].last_order ||
          new Date(order.created_at) >
          new Date(
            customerMap[customerId].last_order
          )
        )
      ) {

        customerMap[customerId].last_order =
          order.created_at;

      }

    });

    customers =
      Object.values(customerMap);

    customers.sort((a, b) =>
      new Date(b.last_order || 0) -
      new Date(a.last_order || 0)
    );

    renderCustomers();

  } catch (error) {

    console.error(error);

    box.innerHTML =
      '<div class="error">' +
      '<strong>Error:</strong><br>' +
      error.message +
      '</div>';

    summary.textContent =
      "Customer loading failed.";

  }

}

function renderCustomers() {

  const search =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const filtered =
    customers.filter(customer => {

      const name =
        String(
          customer.customer_name || ""
        ).toLowerCase();

      const id =
        String(
          customer.customer_id || ""
        ).toLowerCase();

      return (
        !search ||
        name.includes(search) ||
        id.includes(search)
      );

    });

  document.getElementById("summary").textContent =
    "Showing " +
    filtered.length +
    " of " +
    customers.length +
    " customers";

  if (filtered.length === 0) {

    document.getElementById("customers").innerHTML =
      '<div class="message">' +
      'No customers found.' +
      '</div>';

    return;

  }

  document.getElementById("customers").innerHTML =
    filtered.map(customer => {

      const lastOrder =
        customer.last_order
          ? new Date(
              customer.last_order
            ).toLocaleString()
          : "N/A";

      const customerName =
        String(
          customer.customer_name || ""
        );

      const detailsUrl =
        "admin-customer-details.html?customer=" +
        encodeURIComponent(customerName);

      return `

        <div class="customer">

          <h2>
            ${customer.customer_name}
          </h2>

          <p class="customer-id">
            <strong>Customer ID:</strong><br>
            ${customer.customer_id}
          </p>

          <p>
            <strong>Total Orders:</strong>
            ${customer.order_count}
          </p>

          <p>
            <strong>Total Order Value:</strong>
            ${formatNaira(customer.total_spent)}
          </p>

          <p>
            <strong>Last Order:</strong>
            ${lastOrder}
          </p>

          <a
            class="view-details"
            href="${detailsUrl}"
          >
            View Details
          </a>

        </div>

      `;

    }).join("");

}

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    renderCustomers
  );

loadCustomers();

</script>

</body>
</html>
